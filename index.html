<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 디지털 금융 혁신</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 상단 헤더: 좌측 HKWB 3배 확대 로고 / 우측 1/3로 축소된 60개국어 선택 메뉴 */
        header {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: #0d0b21;
            z-index: 1000;
        }

        /* HKWB 로고 3배 확대 (48px) & 노란색 네온 텍스트 */
        .brand-logo {
            font-size: 48px;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: 2px;
            cursor: pointer;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
            line-height: 1;
        }

        /* 드롭다운 메뉴 폭 1/3 수준으로 축소 (슬림형) */
        .lang-select {
            background: #1a173b;
            color: #fbbf24;
            border: 1.5px solid #f59e0b;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            width: 110px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lang-select option {
            background: #0d0b21;
            color: #ffffff;
        }

        /* 메인 컨텐츠 영역 (중앙 정렬) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
        }

        /* 타이틀: 황금색/골드 그라데이션 및 웅장한 타이포그래피 */
        .main-title {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 50px;
            background: linear-gradient(135deg, #fffbeb 0%, #fbbf24 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: keep-all;
            text-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
        }

        /* 버튼 그룹 디자인 개편 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            flex: 1;
            min-width: 260px;
        }

        /* Web3 디지털 은행 진입하기 (골드 네온 버튼) */
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0d0b21;
            box-shadow: 0 4px 25px rgba(245, 158, 11, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.7);
        }

        /* 인터넷 은행 진입하기 (딥 퍼플/골드 아웃라인 버튼) */
        .btn-secondary {
            background: #1a173b;
            color: #fbbf24;
            border: 2px solid #fbbf24;
            box-shadow: 0 4px 20px rgba(26, 23, 59, 0.6);
        }

        .btn-secondary:hover {
            background: #2d2659;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(251, 191, 36, 0.3);
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .brand-logo {
                font-size: 34px;
            }
            .lang-select {
                width: 105px;
                font-size: 12px;
                padding: 5px 6px;
            }
            .main-title {
                font-size: 28px;
                margin-bottom: 36px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                min-width: unset;
                padding: 16px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
