<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 디지털 금융 혁신</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 40px 20px;
        }

        /* 우측 상단 언어 선택 */
        header {
            position: absolute;
            top: 20px;
            right: 40px;
        }

        .lang-select {
            background: #1a173b;
            color: #fff;
            border: 1px solid #3d376d;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* 중앙 정렬 컨텐츠 */
        main {
            max-width: 900px;
            width: 100%;
        }

        .brand-logo {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #a594fd 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #a594fd;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 48px;
            color: #ffffff;
        }

        /* 버튼 그룹 (가운데 정렬) */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: #1e1b4b;
            color: #c7d2fe;
            border: 1px solid #4338ca;
        }

        .btn-secondary:hover {
            background: #312e81;
            color: #ffffff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header {
                top: 15px;
                right: 20px;
            }
            .main-title {
                font-size: 32px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- 우측 상단 언어 선택 -->
    <header>
        <select class="lang-select" aria-label="언어 선택">
            <option value="ko">한국어 (KR)</option>
            <option value="en">English (US)</option>
            <option value="ja">日本語 (JP)</option>
            <option value="zh">中文 (CN)</option>
        </select>
    </header>

    <!-- 중앙 배치 컨텐츠 -->
    <main>
        <div class="brand-logo">HKWB</div>
        <div class="tagline">Next-Generation Digital Banking</div>
        <h1 class="main-title">
            인류와 기술이 공존하는<br>
            차세대 디지털 금융 혁신
        </h1>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="alert('Web3 디지털 은행으로 이동합니다.')">
                Web3 디지털 은행 진입하기
            </button>
            <button class="btn btn-secondary" onclick="alert('인터넷 은행으로 이동합니다.')">
                인터넷 은행 진입하기
            </button>
        </div>
    </main>

</body>
</html>
