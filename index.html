<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB 글로벌 플랫폼</title>
  <style>
    :root {
      --bg-deep: #060918;
      --bg-navy: #0b122c;
      --bg-purple: #180d33;
      --panel-bg: rgba(15, 23, 52, 0.85);
      --panel-border: rgba(255, 211, 105, 0.25);
      --gold: #ffd369;
      --gold-strong: #ffb703;
      --purple-neon: #8b5cf6;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --shadow-gold: 0 0 24px rgba(255, 211, 105, 0.22);
      --shadow-panel: 0 18px 45px rgba(0, 0, 0, 0.45);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 12% 10%, rgba(139, 92, 246, 0.26), transparent 36%),
        radial-gradient(circle at 88% 15%, rgba(255, 211, 105, 0.18), transparent 34%),
        radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.14), transparent 45%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-navy) 52%, var(--bg-purple) 100%);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select,
    input {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 상단 헤더 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(6, 9, 24, 0.86);
      border-bottom: 1px solid rgba(255, 211, 105, 0.18);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 76px;
      padding: 10px 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-strong) 100%);
      color: #090d1e;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      box-shadow: var(--shadow-gold);
      flex-shrink: 0;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-name {
      font-size: clamp(1rem, 2vw, 1.28rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--gold);
      opacity: 0.92;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-link-account {
      padding: 9px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 211, 105, 0.45);
      background: rgba(255, 211, 105, 0.12);
      color: var(--gold);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-link-account:hover {
      background: var(--gold);
      color: #090d1e;
      box-shadow: var(--shadow-gold);
    }

    /* 콤팩트한 언어 선택기 */
    .lang-select {
      width: 100px;
      padding: 8px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 52, 0.96);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hamburger-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 211, 105, 0.35);
      background: rgba(15, 23, 52, 0.92);
      color: var(--gold);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hamburger-btn span {
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      display: block;
    }

    .hamburger-btn:hover {
      border-color: var(--gold);
      box-shadow: var(--shadow-gold);
    }

    /* 서브 네비게이션 */
    .subnav {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(11, 18, 44, 0.68);
    }

    .subnav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      overflow-x: auto;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab {
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-sub);
      border: 1px solid transparent;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .nav-tab.active,
    .nav-tab:hover {
      color: #090d1e;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-strong) 100%);
      box-shadow: var(--shadow-gold);
    }

    .social-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .social-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid rgba(139, 92, 246, 0.45);
      background: rgba(139, 92, 246, 0.14);
      color: #e9d5ff;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .social-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* 삼선 드로어 메뉴 */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
