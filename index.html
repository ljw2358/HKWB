<html lang="ko" dir="ltr">
<head>

  <style>
    :root {
      --bg-grad:
        radial-gradient(circle at 12% 14%, rgba(139, 92, 246, 0.34) 0%, transparent 45%),
        radial-gradient(circle at 88% 18%, rgba(250, 204, 21, 0.17) 0%, transparent 42%),
        radial-gradient(circle at 50% 88%, rgba(79, 70, 229, 0.24) 0%, transparent 52%),
        linear-gradient(155deg, #050711 0%, #100928 45%, #070b1c 100%);
      --card-grad: linear-gradient(145deg, rgba(29, 17, 64, 0.92) 0%, rgba(11, 16, 38, 0.96) 100%);
      --gold-grad: linear-gradient(90deg, #f59e0b 0%, #fde047 52%, #eab308 100%);
      --purple-grad: linear-gradient(135deg, #6d28d9 0%, #9333ea 55%, #c084fc 100%);
      --border-gold: rgba(250, 204, 21, 0.45);
      --border-sub: rgba(192, 132, 252, 0.22);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --gold: #fde047;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.55;
      overflow-x: hidden;
    }

    .gold-text {
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.22));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 9, 22, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-sub);
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      padding: 7px 13px;
      border-radius: 11px;
      background: rgba(109, 40, 217, 0.45);
      border: 1px solid var(--border-gold);
      font-weight: 900;
      font-size: 1rem;
    }

    .chairman {
      font-size: 0.82rem;
      color: var(--gold);
      border: 1px solid rgba(250, 204, 21, 0.35);
      background: rgba(250, 204, 21, 0.08);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .lang-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(24, 15, 54, 0.92);
      border: 1px solid var(--border-gold);
      border-radius: 11px;
      padding: 6px 11px;
      box-shadow: 0 0 16px rgba(147, 51, 234, 0.25);
    }

    .lang-select {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .lang-select option {
      background: #0b0e23;
      color: #f8fafc;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 68px;
    }

    .dash-panel {
      background: var(--card-grad);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(147, 51, 234, 0.2);
      margin-bottom: 24px;
    }

    .dash-title {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .metric-card {
      background: rgba(6, 9, 22, 0.78);
      border: 1px solid var(--border-sub);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .metric-lbl {
      font-size: 0.86rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .metric-val {
      font-size: clamp(1.35rem, 3vw, 1.95rem);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .metric-unit {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      margin-left: 6px;
    }

    .net-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .net-title {
      font-size: 1.2rem;
      font-weight: 900;
    }

    .net-tag {
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 700;
    }

    .net-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    @media (max-width: 640px) {
      .net-grid { grid-template-columns: 1fr; }
    }

    .net-card {
      text-align: center;
      padding: 20px 16px;
      border-radius: 18px;
      background: var(--card-grad);
      border: 1px solid var(--border-sub);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .net-card:hover,
    .net-card.selected {
      border-color: var(--border-gold);
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.22), 0 0 18px rgba(147, 51, 234, 0.28);
      transform: translateY(-1px);
    }

    .net-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(147, 51, 234, 0.22);
      border: 1px solid rgba(250, 204, 21, 0.35);
      color: var(--gold);
      font-weight: 900;
      font-size: 1rem;
    }

    .net-name {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--gold);
      display: block;
      margin-bottom: 5px;
    }

    .net-desc {
      font-size: 0.84rem;
      color: var(--text-sub);
      display: block;
    }

    .action-panel {
      background: var(--card-grad);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    .run-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .run-row { grid-template-columns: 1fr; }
    }

    .field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-sub);
      background: rgba(5, 8, 19, 0.92);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
    }

    .field:focus {
      border-color: var(--border-gold);
    }

    .btn-neon {
      background: var(--purple-grad);
      color: #ffffff;
      border: 1px solid rgba(253, 224, 71, 0.65);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(147, 51, 234, 0.42);
    }

    .out-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(4, 7, 18, 0.94);
      border: 1px solid rgba(250, 204, 21, 0.35);
      color: var(--gold);
      font-size: 0.88rem;
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    [dir="rtl"] .topbar-inner,
    [dir="rtl"] .net-section-head {
      direction: rtl;
    }
  </style>
</head>

          p_wallet: '钱包连接', p_transfer: '转账', p_payment: '支付', p_deposit: '存入',
          p_reward: '奖励', p_ubi: '基本收入', p_swap: '兑换', p_dex: 'DEX兑换',
          p_lp: 'LP质押', p_pi: 'PI数量',
          btn_run: '执行流程'
        },
        ja: {
          page_title: 'HKWB | 個人資産ダッシュボード＆分散連動網',
          brand: 'HKWB',
          chairman: 'イ・ジェワン · へゴン チェアマン',
          dash_title: '個人資産ダッシュボード',
          pi_lbl: '● 保有数量（PI台帳同期）',
          yield_lbl: '📈 リアルタイム累積収益（AGI / ASI）',
          net_title: '分散連動網',
          net_tag: '[個別プロセス稼働]',
          p_wallet: 'ウォレット連携', p_transfer: '送金', p_payment: '決済', p_deposit: '預け入れ',
          p_reward: '報酬', p_ubi: 'ベーシックインカム', p_swap: 'スワップ', p_dex: 'DEXスワップ',
          p_lp: 'LPステーキング', p_pi: 'PI数量',
          btn_run: 'プロセス実行'
        }
      };

      const PROC_KO = {
        wallet: '지갑연결',
        transfer: '송금',
        payment: '결제',
        deposit: '예치',
        reward: '보상',
        ubi: '기본소득',
        swap: '스왑',
        dex_swap: 'DEX 스왑',
        lp_staking: 'LP 스테이킹',
        pi_qty: '파이 수량'
      };

      const st = {
        lang: 'ko',
        proc: 'wallet',
        pi: 314159,
        yieldAmt: 12450893.185
      };

      function refreshNums() {
        document.getElementById('pi-val').textContent =
          st.pi.toLocaleString(undefined, { minimumFractionDigits: 6, maximumFractionDigits: 6 });
        document.getElementById('yield-val').textContent =
          st.yieldAmt.toLocaleString(undefined, { minimumFractionDigits: 6, maximumFractionDigits: 6 });
      }

      function applyLang(code) {
        const valid = LANGS.some((l) => l.code === code) ? code : 'ko';
        st.lang = valid;
        document.documentElement.lang = valid;
        document.documentElement.dir = RTL.has(valid) ? 'rtl' : 'ltr';
        const dict = I18N[valid] || I18N.en || I18N.ko;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const k = el.dataset.i18n;
          if (dict[k]) el.textContent = dict[k];
        });
        const sel = document.getElementById('lang-select');
        if (sel && sel.value !== valid) sel.value = valid;
        try { localStorage.setItem('hkwb_lang', valid); } catch (_) {}
      }

      document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('lang-select');
        LANGS.forEach((l, idx) => {
          const opt = document.createElement('option');
          opt.value = l.code;
          opt.textContent = `${String(idx + 1).padStart(2, '0')}. ${l.native} (${l.code.toUpperCase()})`;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', (e) => applyLang(e.target.value));

        document.querySelectorAll('.net-card').forEach((card) => {
          card.addEventListener('click', () => {
            st.proc = card.dataset.proc;
            document.querySelectorAll('.net-card').forEach((c) => c.classList.toggle('selected', c === card));
            document.getElementById('selected-proc-label').textContent =
              `선택된 프로세스: ${PROC_KO[st.proc] || st.proc}`;
          });
        });

        document.getElementById('proc-run-btn').addEventListener('click', () => {
          const raw = (document.getElementById('proc-input').value || '').trim();
          const num = parseFloat(raw.replace(/,/g, ''));
          const amt = !Number.isNaN(num) && num > 0 ? num : 100;
          const name = PROC_KO[st.proc] || st.proc;

          if (st.proc === 'pi_qty' || st.proc === 'reward' || st.proc === 'ubi') {
            st.pi += amt;
          } else if (st.proc === 'transfer' || st.proc === 'payment' || st.proc === 'deposit' || st.proc === 'swap' || st.proc === 'dex_swap') {
            st.pi = Math.max(0, st.pi - Math.min(amt, st.pi));
            st.yieldAmt += amt * 0.05;
          } else if (st.proc === 'lp_staking') {
            st.yieldAmt += amt * 0.1;
          }

          refreshNums();
          document.getElementById('proc-out').textContent =
            `[${name}] 실행 완료 · 입력: ${raw || amt} · 보유 수량: ${st.pi.toLocaleString(undefined, { minimumFractionDigits: 6, maximumFractionDigits: 6 })} PI`;
        });

        let saved = 'ko';
        try { saved = localStorage.getItem('hkwb_lang') || 'ko'; } catch (_) {}
        applyLang(saved);
        refreshNums();
      });
    })();
  </script>
</body>
</html>
