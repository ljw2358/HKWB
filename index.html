<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB · HK WorldBank</title>
  <style>
    :root {
      --bg-main: #06040e;
      --bg-panel: #120d26;
      --bg-card: #1a1438;
      --bg-card-hover: #241b4b;
      --gold-light: #fff1b8;
      --gold: #f5c451;
      --gold-dark: #c58417;
      --blue: #2563eb;
      --blue-soft: #93c5fd;
      --emerald: #34d399;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --line-gold: rgba(245, 196, 81, 0.42);
      --line-blue: rgba(147, 197, 253, 0.36);
      --line-soft: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans", sans-serif;
      background: radial-gradient(circle at 50% 10%, #271752 0%, var(--bg-main) 68%, #030207 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    /* 첫 화면 (외부 껍질: 우측 상단 축소 '한국어', 타이틀·슬로건, 진입버튼 2개만 표시) */
    .first-page {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .lang-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 28px;
    }

    .lang-fixed {
      background: rgba(26, 20, 56, 0.94);
      border: 1px solid var(--line-gold);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.2px;
      user-select: none;
    }

    select, input, button {
      font-family: inherit;
      color: var(--text);
    }

    .hero-brand {
      width: 100%;
      padding: 38px 20px 46px;
      margin-bottom: 32px;
      background: linear-gradient(145deg, rgba(44, 24, 92, 0.72), rgba(14, 10, 30, 0.92));
      border: 1px solid var(--line-gold);
      border-radius: 26px;
    }

    .hero-title {
      font-size: clamp(2.8rem, 7.2vw, 5rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #ffffff, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .hero-slogan {
      font-size: clamp(1.35rem, 3.3vw, 2.2rem);
      font-weight: 800;
      line-height: 1.38;
      background: linear-gradient(90deg, var(--blue-soft), var(--gold-light), #e9d5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 860px;
      margin: 0 auto;
    }

    .entry-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 660px) {
      .entry-grid {
        grid-template-columns: 1fr;
      }
      .lang-bar {
        margin-bottom: 20px;
      }
      .hero-brand {
        padding: 26px 14px 32px;
        margin-bottom: 22px;
      }
    }

    .entry-card {
      background: rgba(26, 20, 56, 0.92);
      border: 1px solid var(--line-gold);
      border-radius: 22px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      transition: transform 0.2s ease;
    }

    .entry-card.internet {
      border-color: var(--line-blue);
    }

    .entry-card:hover {
      transform: translateY(-4px);
    }

    .entry-card h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .entry-card p {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .btn-enter {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-enter.web3 {
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      color: #161003;
    }

    .btn-enter.internet {
      background: linear-gradient(90deg, #60a5fa, var(--blue));
      color: #ffffff;
    }

    /* 안쪽 페이지 (진입 버튼을 눌렀을 때만 양파 속처럼 열림) */
    .inner-page {
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--line-gold);
      border-radius: 22px;
      padding: 22px;
      animation: fadeIn 0.2s ease;
    }

    .inner-page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .inner-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .inner-top h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold);
    }

    .back-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-gold);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold-light);
      cursor: pointer;
    }

    .net-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .net-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .net-btn.active, .net-btn:hover {
      border-color: var(--gold);
      background: var(--bg-card-hover);
    }

    .net-btn strong {
      display: block;
      font-size: 0.9rem;
      color: var(--gold-light);
    }

    .net-btn span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .box {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 16px;
    }

    .box h3 {
      font-size: 1.02rem;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .field select, .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0c081b;
      font-size: 0.92rem;
    }

    .calc-box {
      background: rgba(7, 5, 16, 0.88);
      border: 1px dashed rgba(245, 196, 81, 0.45);
      border-radius: 10px;
      padding: 11px;
      margin: 12px 0;
      font-size: 0.86rem;
      color: var(--gold-light);
    }

    .gold-btn {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      color: #161003;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .six-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .six-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .six-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    .six-btn.active, .six-btn:hover {
      border-color: var(--blue-soft);
      background: var(--bg-card-hover);
    }

    .six-btn strong {
      display: block;
      font-size: 0.94rem;
      color: var(--gold-light);
      margin-bottom: 2px;
    }

    .six-btn span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .rate-tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.86rem;
    }

    .rate-tbl th, .rate-tbl td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
    }

    .rate-tbl th {
      color: var(--gold);
    }

    .rate-em {
      color: var(--emerald);
      font-weight: 800;
    }

    .credit-box {
      background: linear-gradient(125deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.16));
      border: 1px solid rgba(52, 211, 153, 0.45);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .credit-score {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--emerald);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 양파 1단계: 첫 화면 -->
    <section class="first-page" id="firstPage">
      <!-- 우측 상단으로 이동 및 축소된 한국어 표시 (고정) -->
      <div class="lang-bar">
        <div class="lang-fixed">한국어</div>
      </div>

      <div class="hero-brand">
        <h1 class="hero-title">HKWB · HK WorldBank</h1>
        <p class="hero-slogan">인류와 기술이 공존하는 차세대 디지털 금융 혁신</p>
      </div>

      <div class="entry-grid">
        <div class="entry-card web3">
          <div>
            <h2>웹3 디지털 은행</h2>
            <p>안쪽 열기: 10대 분산 연동망 · 스왑 · 예치 · UBI</p>
          </div>
          <button type="button" class="btn-enter web3" onclick="peelLayer('web3')">
            웹3 디지털 은행 진입하기
          </button>
        </div>

        <div class="entry-card internet">
          <div>
            <h2>인터넷 은행</h2>
            <p>안쪽 열기: 입금·출금·송금·예치·적금·대출 · 신용점수</p>
          </div>
          <button type="button" class="btn-enter internet" onclick="peelLayer('internet')">
            인터넷 은행 진입하기
          </button>
        </div>
      </div>
    </section>

    <!-- 양파 2단계 A: 웹3 디지털 은행 안쪽 -->
    <section class="inner-page" id="web3Inner">
      <div class="inner-top">
        <h2>웹3 디지털 은행 — 10대 분산 연동망</h2>
        <button type="button" class="back-btn" onclick="peelLayer('home')">← 첫 화면</button>
      </div>

      <div class="net-grid" id="netGrid"></div>

      <div class="two-col">
        <div class="box">
          <h3>스왑 &amp; DEX 스왑</h3>
          <div class="field">
            <label for="fromAsset">출발 자산</label>
            <select id="fromAsset" onchange="calcSwap()"></select>
          </div>
          <div class="field">
            <label for="toAsset">도착 자산</label>
            <select id="toAsset" onchange="calcSwap()"></select>
          </div>
          <div class="field">
            <label for="swapQty">수량</label>
            <input type="number" id="swapQty" value="100" min="0" step="any" oninput="calcSwap()" />
          </div>
          <div class="calc-box" id="swapCalcOut"></div>
          <button type="button" class="gold-btn" onclick="calcSwap()">계산 반영</button>
        </div>

        <div class="box">
          <h3>기간별 예치 이자율</h3>
          <div class="field">
            <label for="w3Term">예치 기간</label>
            <select id="w3Term" onchange="calcW3Dep()"></select>
          </div>
          <div class="field">
            <label for="w3Amt">예치 금액 (KRW)</label>
            <input type="number" id="w3Amt" value="10000000" min="0" step="10000" oninput="calcW3Dep()" />
          </div>
          <div class="calc-box" id="w3DepOut"></div>
          <button type="button" class="gold-btn" onclick="calcW3Dep()">계산 반영</button>
        </div>
      </div>
    </section>

    <!-- 양파 2단계 B: 인터넷 은행 안쪽 -->
    <section class="inner-page" id="internetInner">
      <div class="inner-top">
        <h2>인터넷 은행 — 6대 기능 · 예치 이자율 · 신용점수</h2>
        <button type="button" class="back-btn" onclick="peelLayer('home')">← 첫 화면</button>
      </div>

      <div class="six-grid">
        <button type="button" class="six-btn active" data-fn="deposit" onclick="pickFn('deposit')">
          <strong>1. 입금</strong>
          <span>DEPOSIT</span>
        </button>
        <button type="button" class="six-btn" data-fn="withdraw" onclick="pickFn('withdraw')">
          <strong>2. 출금</strong>
          <span>WITHDRAW</span>
        </button>
        <button type="button" class="six-btn" data-fn="transfer" onclick="pickFn('transfer')">
          <strong>3. 송금</strong>
          <span>TRANSFER</span>
        </button>
        <button type="button" class="six-btn" data-fn="staking" onclick="pickFn('staking')">
          <strong>4. 예치</strong>
          <span>TERM DEPOSIT</span>
        </button>
        <button type="button" class="six-btn" data-fn="savings" onclick="pickFn('savings')">
          <strong>5. 적금</strong>
          <span>SAVINGS</span>
        </button>
        <button type="button" class="six-btn" data-fn="loan" onclick="pickFn('loan')">
          <strong>6. 대출</strong>
          <span>LOAN</span>
        </button>
      </div>

      <div class="two-col">
        <div class="box">
          <h3>예치 이자율 안내</h3>
          <div class="field">
            <label for="bankTerm">예치 기간</label>
            <select id="bankTerm" onchange="calcBank()"></select>
          </div>
          <div class="field">
            <label for="bankAmt">금액 (KRW)</label>
            <input type="number" id="bankAmt" value="10000000" min="0" step="10000" oninput="calcBank()" />
          </div>
          <div class="calc-box" id="bankCalcOut"></div>

          <table class="rate-tbl">
            <thead>
              <tr>
                <th>기간</th>
                <th>이자율</th>
              </tr>
            </thead>
            <tbody id="rateRows"></tbody>
          </table>
        </div>

        <div class="box">
          <h3>신용정보 조회 (NICE + 블록체인)</h3>
          <div class="field">
            <label for="niceIn">NICE 지수 (0~100)</label>
            <input type="number" id="niceIn" value="88" min="0" max="100" />
          </div>
          <div class="field">
            <label for="chainIn">블록체인 지수 (0~100)</label>
            <input type="number" id="chainIn" value="92" min="0" max="100" />
          </div>
          <button type="button" class="gold-btn" onclick="calcCredit()">신용정보 점수 조회</button>

          <div class="credit-box">
            <div>
              <div style="font-size:0.78rem; color:var(--text-sub);">통합 신용점수</div>
              <div class="credit-score" id="creditScoreOut">915점</div>
            </div>
            <div style="font-size:0.84rem; text-align:right;" id="creditLimitOut"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const ASSETS = [
      { id: "PI", sym: "PI", name: "파이", krw: 2400 },
      { id: "USDT", sym: "USDT", name: "테더", krw: 1420 },
      { id: "XRP", sym: "XRP", name: "리플", krw: 1850 },
      { id: "SOL", sym: "SOL", name: "솔라나", krw: 245000 },
      { id: "ETH", sym: "ETH", name: "이더리움", krw: 4250000 },
      { id: "BTC", sym: "BTC", name: "비트코인", krw: 118000000 }
    ];

    const NET_10 = [
      { id: "wallet", title: "1. 지갑연결", sub: "멀티체인 지갑 연동" },
      { id: "remit", title: "2. 송금", sub: "즉시 온체인 송금" },
      { id: "pay", title: "3. 결재", sub: "글로벌 결재 연동" },
      { id: "deposit", title: "4. 예치", sub: "기간별 이자 예치" },
      { id: "reward", title: "5. 보상", sub: "참여 리워드 지급" },
      { id: "ubi", title: "6. 기본소득", sub: "최대 60% UBI 환원" },
      { id: "swap", title: "7. 스왑", sub: "즉시 자산 전환" },
      { id: "dex", title: "8. DEX스왑", sub: "탈중앙 유동성 스왑" },
      { id: "lp", title: "9. LP스테이킹", sub: "유동성 풀 스테이킹" },
      { id: "piQty", title: "10. PI수량", sub: "파이 수량 연동" }
    ];

    const TERMS = {
      "6m": { label: "6개월", min: 8.0, max: 12.0, yrs: 0.5 },
      "1y": { label: "1년", min: 12.0, max: 18.0, yrs: 1.0 },
      "2y": { label: "2년", min: 16.0, max: 24.0, yrs: 2.0 },
      "3y": { label: "3년", min: 20.0, max: 31.4, yrs: 3.0 }
    };

    let curNet = "swap";
    let curFn = "deposit";

    function fmtKrw(n) {
      return "₩ " + Math.round(n).toLocaleString("ko-KR");
    }

    function fmtQty(n) {
      if (n >= 1000) return n.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
      if (n >= 1) return n.toLocaleString("ko-KR", { maximumFractionDigits: 4 });
      return n.toLocaleString("ko-KR", { maximumFractionDigits: 6 });
    }

    function peelLayer(layer) {
      const first = document.getElementById("firstPage");
      const w3Inner = document.getElementById("web3Inner");
      const inInner = document.getElementById("internetInner");

      first.style.display = "none";
      w3Inner.classList.remove("active");
      inInner.classList.remove("active");

      if (layer === "web3") {
        w3Inner.classList.add("active");
      } else if (layer === "internet") {
        inInner.classList.add("active");
      } else {
        first.style.display = "flex";
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderNets() {
      document.getElementById("netGrid").innerHTML = NET_10.map((n) => `
        <button type="button" class="net-btn ${curNet === n.id ? "active" : ""}" onclick="pickNet('${n.id}')">
          <strong>${n.title}</strong>
          <span>${n.sub}</span>
        </button>
      `).join("");
    }

    function pickNet(id) {
      curNet = id;
      renderNets();
    }

    function fillAssetSelects() {
      const f = document.getElementById("fromAsset");
      const t = document.getElementById("toAsset");
      const prevF = f.value || "PI";
      const prevT = t.value || "USDT";
      const opts = ASSETS.map((a) => `<option value="${a.id}">${a.name} (${a.sym})</option>`).join("");
      f.innerHTML = opts;
      t.innerHTML = opts;
      f.value = prevF;
      t.value = prevT;
    }

    function fillTermSelects() {
      const w3 = document.getElementById("w3Term");
      const bk = document.getElementById("bankTerm");
      const prevW3 = w3.value || "1y";
      const prevBk = bk.value || "1y";
      const html = Object.entries(TERMS).map(([k, v]) =>
        `<option value="${k}">${v.label} (${v.min}% ~ ${v.max}%)</option>`
      ).join("");
      w3.innerHTML = html;
      bk.innerHTML = html;
      w3.value = prevW3;
      bk.value = prevBk;

      document.getElementById("rateRows").innerHTML = Object.values(TERMS).map((v) =>
        `<tr><td>${v.label}</td><td class="rate-em">${v.min}% ~ ${v.max}%</td></tr>`
      ).join("");
    }

    function calcSwap() {
      const fId = document.getElementById("fromAsset").value;
      const tId = document.getElementById("toAsset").value;
      const qty = Math.max(0, parseFloat(document.getElementById("swapQty").value) || 0);
      const aFrom = ASSETS.find((a) => a.id === fId) || ASSETS[0];
      const aTo = ASSETS.find((a) => a.id === tId) || ASSETS[1];
      const out = qty * (aFrom.krw / aTo.krw) * 0.997;
      document.getElementById("swapCalcOut").innerHTML =
        `<strong>${fmtQty(qty)} ${aFrom.sym}</strong> → <strong>${fmtQty(out)} ${aTo.sym}</strong>`;
    }

    function calcW3Dep() {
      const t = TERMS[document.getElementById("w3Term").value] || TERMS["1y"];
      const amt = Math.max(0, parseFloat(document.getElementById("w3Amt").value) || 0);
      const minI = amt * (t.min / 100) * t.yrs;
      const maxI = amt * (t.max / 100) * t.yrs;
      document.getElementById("w3DepOut").innerHTML =
        `${t.label} (${t.min}%~${t.max}%) · 예상 이자: <strong>${fmtKrw(minI)} ~ ${fmtKrw(maxI)}</strong>`;
    }

    function pickFn(fn) {
      curFn = fn;
      document.querySelectorAll(".six-btn").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-fn") === fn);
      });
      calcBank();
    }

    function calcBank() {
      const t = TERMS[document.getElementById("bankTerm").value] || TERMS["1y"];
      const amt = Math.max(0, parseFloat(document.getElementById("bankAmt").value) || 0);
      const minI = amt * (t.min / 100) * t.yrs;
      const maxI = amt * (t.max / 100) * t.yrs;
      document.getElementById("bankCalcOut").innerHTML =
        `${fmtKrw(amt)} (${t.label}) · 예상 이자: <strong>${fmtKrw(minI)} ~ ${fmtKrw(maxI)}</strong>`;
    }

    function calcCredit() {
      const niceV = Math.max(0, Math.min(100, parseFloat(document.getElementById("niceIn").value) || 0));
      const chainV = Math.max(0, Math.min(100, parseFloat(document.getElementById("chainIn").value) || 0));
      const score = Math.round(300 + ((niceV * 0.55 + chainV * 0.45) / 100) * 700);
      const limit = score >= 900 ? 200000000 : score >= 800 ? 100000000 : 50000000;
      document.getElementById("creditScoreOut").textContent = `${score}`;
      document.getElementById("creditLimitOut").innerHTML = `추천 한도: <strong>${fmtKrw(limit)}</strong>`;
    }

    renderNets();
    fillAssetSelects();
    fillTermSelects();
    calcSwap();
    calcW3Dep();
    calcBank();
    calcCredit();
  </script>
</body>
</html>
