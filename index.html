<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB - 인류와 기술이 공존하는 차세대 디지털 금융 혁신</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    body {
      background: #060b16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: 100%;
      padding: 14px 28px;
      background: #091122;
      border-bottom: 1px solid #1e2d4a;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .lang-box {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #101c33;
      border: 1px solid #2b416b;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .lang-box select {
      background: transparent;
      color: #f8fafc;
      border: none;
      outline: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-box select option {
      background: #101c33;
      color: #f8fafc;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 36px 24px 64px;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #facc15;
      margin-bottom: 8px;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: #e2e8f0;
      font-weight: 500;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }

    .card {
      background: #111b2e;
      border: 1px solid #223558;
      border-radius: 14px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .btn-gold {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #f5b914;
      color: #0b1220;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-gold:hover {
      filter: brightness(1.06);
    }

    .btn-blue {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-blue:hover {
      filter: brightness(1.08);
    }

    .meta-row {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .status-bar {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #0b1324;
      border: 1px solid #1e2d4a;
      color: #bae6fd;
      font-size: 0.86rem;
    }

    footer {
      padding: 18px 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #152238;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="lang-box">
      <select id="lang-select" aria-label="언어 선택">
        <option value="ko" selected>한국어 (Korean)</option>
        <option value="en">English</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="vi">Tiếng Việt</option>
        <option value="es">Español</option>
      </select>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title" id="hero-title">HKWB</h1>
      <p class="hero-sub" id="hero-sub">인류와 기술이 공존하는 차세대 디지털 금융 혁신</p>
    </section>

    <section class="cards">
      <article class="card">
        <div>
          <h2 class="card-title" id="web3-title">웹3 디지털 은행</h2>
          <p class="card-desc" id="web3-desc">
            지갑연결 · 송금 · 결재 · 예치 · 보상 · 기본소득 · 스왑 · DEX스왑 · LP스테이킹 · PI수량
          </p>
        </div>
        <button type="button" class="btn-gold" id="web3-btn">웹3 디지털 은행 진입하기</button>
      </article>

      <article class="card">
        <div>
          <h2 class="card-title" id="bank-title">인터넷 은행 (HK 뱅크)</h2>
          <p class="card-desc" id="bank-desc">
            계좌 개설 · 입출금 · 즉시이체 · 예금 · 적금 · 대출 · 신용 점수 조회
          </p>
        </div>
        <button type="button" class="btn-blue" id="bank-btn">인터넷 은행 진입하기</button>
      </article>
    </section>

    <div class="meta-row">
      <div>추천인: <strong>ljw2358</strong></div>
      <div>support@hkwb.world</div>
    </div>

    <div class="status-bar" id="status-bar">
      대기 중 — 한국어 선택창이 우측 상단에 배치되었습니다.
    </div>
  </main>

  <footer>
    HKWB · hkwb.world · ljw2358.github.io/HKWB · ljw2358/bank
  </footer>

  <script>
    const TEXTS = {
      ko: {
        title: "HKWB",
        sub: "인류와 기술이 공존하는 차세대 디지털 금융 혁신",
        web3Title: "웹3 디지털 은행",
        web3Desc: "지갑연결 · 송금 · 결재 · 예치 · 보상 · 기본소득 · 스왑 · DEX스왑 · LP스테이킹 · PI수량",
        web3Btn: "웹3 디지털 은행 진입하기",
        bankTitle: "인터넷 은행 (HK 뱅크)",
        bankDesc: "계좌 개설 · 입출금 · 즉시이체 · 예금 · 적금 · 대출 · 신용 점수 조회",
        bankBtn: "인터넷 은행 진입하기"
      },
      en: {
        title: "HKWB",
        sub: "Next-Generation Digital Financial Innovation Where Humanity and Technology Coexist",
        web3Title: "Web3 Digital Bank",
        web3Desc: "Wallet · Transfer · Payment · Deposit · Reward · UBI · Swap · DEX Swap · LP Staking · Pi Balance",
        web3Btn: "Enter Web3 Digital Bank",
        bankTitle: "Internet Bank (HK Bank)",
        bankDesc: "Account Opening · Deposit/Withdrawal · Instant Transfer · Savings · Loan · Credit Score",
        bankBtn: "Enter Internet Bank"
      },
      zh: {
        title: "HKWB",
        sub: "人类与技术共存的新一代数字金融创新",
        web3Title: "Web3 数字银行",
        web3Desc: "钱包连接 · 转账 · 支付 · 存款 · 奖励 · 基本收入 · 兑换 · DEX兑换 · LP质押 · Pi数量",
        web3Btn: "进入 Web3 数字银行",
        bankTitle: "互联网银行 (HK 银行)",
        bankDesc: "开户 · 存取款 · 即时转账 · 定期 · 储蓄 · 贷款 · 信用查询",
        bankBtn: "进入互联网银行"
      },
      ja: {
        title: "HKWB",
        sub: "人類と技術が共存する次世代デジタル金融イノベーション",
        web3Title: "Web3 デジタル銀行",
        web3Desc: "ウォレット連携 · 送金 · 決済 · 預け入れ · 報酬 · ベーシックインカム · スワップ · DEX · LPステーキング · Pi数量",
        web3Btn: "Web3 デジタル銀行へ",
        bankTitle: "インターネット銀行 (HK バンク)",
        bankDesc: "口座開設 · 入出金 · 即時振込 · 預金 · 積立 · ローン · 信用スコア照会",
        bankBtn: "インターネット銀行へ"
      },
      vi: {
        title: "HKWB",
        sub: "Đổi mới tài chính số thế hệ mới nơi con người và công nghệ cùng phát triển",
        web3Title: "Ngân hàng số Web3",
        web3Desc: "Kết nối ví · Chuyển tiền · Thanh toán · Gửi · Thưởng · Thu nhập cơ bản · Hoán đổi · DEX · LP Staking · Số dư Pi",
        web3Btn: "Vào Ngân hàng số Web3",
        bankTitle: "Ngân hàng Internet (HK Bank)",
        bankDesc: "Mở tài khoản · Nạp/Rút · Chuyển nhanh · Tiết kiệm · Vay · Điểm tín dụng",
        bankBtn: "Vào Ngân hàng Internet"
      },
      es: {
        title: "HKWB",
        sub: "Innovación financiera digital de próxima generación donde conviven humanidad y tecnología",
        web3Title: "Banco Digital Web3",
        web3Desc: "Billetera · Transferencia · Pago · Depósito · Recompensa · Renta básica · Swap · DEX · LP Staking · Saldo Pi",
        web3Btn: "Entrar al Banco Digital Web3",
        bankTitle: "Banco por Internet (HK Bank)",
        bankDesc: "Abrir cuenta · Depósito/Retiro · Transferencia · Ahorros · Préstamo · Puntaje crediticio",
        bankBtn: "Entrar al Banco por Internet"
      }
    };

    const langSelect = document.getElementById("lang-select");
    const statusBar = document.getElementById("status-bar");

    function setLanguage(code) {
      const t = TEXTS[code] || TEXTS.ko;
      document.documentElement.lang = code;
      document.getElementById("hero-title").textContent = t.title;
      document.getElementById("hero-sub").textContent = t.sub;
      document.getElementById("web3-title").textContent = t.web3Title;
      document.getElementById("web3-desc").textContent = t.web3Desc;
      document.getElementById("web3-btn").textContent = t.web3Btn;
      document.getElementById("bank-title").textContent = t.bankTitle;
      document.getElementById("bank-desc").textContent = t.bankDesc;
      document.getElementById("bank-btn").textContent = t.bankBtn;
      localStorage.setItem("hk_worldbank_lang", code);
    }

    const savedLang = localStorage.getItem("hk_worldbank_lang") || "ko";
    langSelect.value = savedLang;
    setLanguage(savedLang);

    langSelect.addEventListener("change", (e) => {
      setLanguage(e.target.value);
      statusBar.textContent = `선택된 언어: ${e.target.options[e.target.selectedIndex].text}`;
    });

    document.getElementById("web3-btn").addEventListener("click", () => {
      statusBar.textContent = "웹3 디지털 은행 메뉴가 선택되었습니다. (추천인: ljw2358)";
    });

    document.getElementById("bank-btn").addEventListener("click", () => {
      statusBar.textContent = "인터넷 은행 (HK 뱅크) 메뉴가 선택되었습니다. (문의: support@hkwb.world)";
    });
  </script>
</body>
</html>
