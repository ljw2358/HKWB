<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB · HK WorldBank</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(circle at top, #17153b 0%, #090b1e 55%, #050612 100%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .page-wrapper {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 상단 언어 바 */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .lang-status {
      font-size: 11px;
      color: #9ca3af;
      background: rgba(17, 24, 39, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .lang-btn {
      background: #141936;
      color: #e5e7eb;
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .lang-btn:hover {
      border-color: #facc15;
      color: #fde047;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      top: 32px;
      right: 0;
      width: 210px;
      max-height: 240px;
      overflow-y: auto;
      background: #0d1229;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      z-index: 999;
      padding: 4px;
    }

    .lang-dropdown.open {
      display: block;
    }

    .lang-search {
      width: 100%;
      padding: 5px 7px;
      margin-bottom: 4px;
      font-size: 11px;
      color: #f9fafb;
      background: #161d3f;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 5px;
      outline: none;
    }

    .lang-option {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #e5e7eb;
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lang-option:hover,
    .lang-option.active {
      background: rgba(99, 102, 241, 0.25);
      color: #fde047;
      font-weight: 600;
    }

    /* 메인 카드 컨테이너 */
    .gateway-card {
      width: 100%;
      background: rgba(15, 20, 46, 0.86);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: 14px;
      padding: 18px 18px 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #facc15;
      margin-bottom: 4px;
    }

    .brand-tagline {
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(90deg, #93c5fd 0%, #c084fc 50%, #facc15 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 14px;
    }

    /* 2분할 은행 카드 */
    .bank-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      text-align: center;
    }

    .bank-box {
      background: rgba(10, 14, 34, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .bank-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .bank-desc {
      font-size: 10.5px;
      line-height: 1.4;
      color: #cbd5e1;
      word-break: keep-all;
    }

    .btn-web3 {
      width: 100%;
      background: #facc15;
      color: #111827;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-web3:hover {
      background: #fde047;
      transform: translateY(-1px);
    }

    .btn-internet {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-internet:hover {
      background: #3b82f6;
      transform: translateY(-1px);
    }

    /* 하단 푸터 */
    .footer-info {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
      padding: 0 4px;
    }

    .footer-info span {
      color: #e2e8f0;
      font-weight: 600;
    }

    /* Google 번역 기본 상단 배너 숨김 */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-gadget-icon {
      display: none !important;
    }
    body {
      top: 0 !important;
    }
    #google_translate_element {
      display: none;
    }

    @media (max-width: 520px) {
      .bank-grid {
        grid-template-columns: 1fr;
      }
      .gateway-card {
        padding: 14px 12px;
      }
      .brand-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="google_translate_element"></div>

  <div class="page-wrapper">
    <div class="top-bar">
      <span class="lang-status" id="langStatus">60개국어 지원 · 현재: 한국어</span>
      <button type="button" class="lang-btn" id="langToggleBtn" aria-expanded="false">
        <span id="currentLangLabel">한국어</span>
        <span>▼</span>
      </button>

      <div class="lang-dropdown" id="langDropdown" role="listbox" aria-label="언어 선택">
        <input type="text" class="lang-search" id="langSearch" placeholder="언어 검색..." />
        <div id="langList"></div>
      </div>
    </div>

    <main class="gateway-card">
      <h1 class="brand-title" data-i18n="title">HKWB · HK WorldBank</h1>
      <p class="brand-tagline" data-i18n="tagline">인류와 기술이 공존하는 차세대 디지털 금융 혁신</p>

      <section class="bank-grid">
        <div class="bank-box">
          <div>
            <div class="bank-name" data-i18n="web3Title">웹3 디지털 은행</div>
            <p class="bank-desc" data-i18n="web3Desc">
              지갑연결 · 송금 · 결재 · 예치 · 보상 · 기본소득 · 스왑 · DEX스왑 · LP스테이킹 · PI수량
            </p>
          </div>
          <button type="button" class="btn-web3" id="enterWeb3Btn" data-i18n="web3Btn">
            웹3 디지털 은행 진입하기
          </button>
        </div>

        <div class="bank-box">
          <div>
            <div class="bank-name" data-i18n="internetTitle">인터넷 은행</div>
            <p class="bank-desc" data-i18n="internetDesc">
              계좌 개설 · 입출금 · 즉시이체 · 예금 · 적금 · 대출 · 무료 신용점수 조회
            </p>
          </div>
          <button type="button" class="btn-internet" id="enterInternetBtn" data-i18n="internetBtn">
            인터넷 은행 진입하기
          </button>
        </div>
      </section>
    </main>

    <footer class="footer-info">
      <div><span data-i18n="footerRole">체어맨 이재완</span> · <span data-i18n="footerRefLabel">추천인</span>: <span>ljw2358</span></div>
      <div><span data-i18n="footerSupportLabel">문의</span>: <span>support@hkwb.world</span></div>
    </footer>
  </div>

  <script>
    const LANGUAGES_60 = [
      { code: "ko", name: "한국어", native: "한국어" },
      { code: "en", name: "영어", native: "English" },
      { code: "ja", name: "일본어", native: "日本語" },
      { code: "zh-CN", name: "중국어(간체)", native: "简体中文" },
      { code: "zh-TW", name: "중국어(번체)", native: "繁體中文" },
      { code: "es", name: "스페인어", native: "Español" },
      { code: "fr", name: "프랑스어", native: "Français" },
      { code: "de", name: "독일어", native: "Deutsch" },
      { code: "it", name: "이탈리아어", native: "Italiano" },
      { code: "pt", name: "포르투갈어", native: "Português" },
      { code: "ru", name: "러시아어", native: "Русский" },
      { code: "ar", name: "아랍어", native: "العربية" },
      { code: "hi", name: "힌디어", native: "हिन्दी" },
      { code: "vi", name: "베트남어", native: "Tiếng Việt" },
      { code: "th", name: "태국어", native: "ไทย" },
      { code: "id", name: "인도네시아어", native: "Bahasa Indonesia" },
      { code: "ms", name: "말레이어", native: "Bahasa Melayu" },
      { code: "tl", name: "타갈로그어", native: "Tagalog" },
      { code: "tr", name: "튀르키예어", native: "Türkçe" },
      { code: "nl", name: "네덜란드어", native: "Nederlands" },
      { code: "pl", name: "폴란드어", native: "Polski" },
      { code: "sv", name: "스웨덴어", native: "Svenska" },
      { code: "no", name: "노르웨이어", native: "Norsk" },
      { code: "da", name: "덴마크어", native: "Dansk" },
      { code: "fi", name: "핀란드어", native: "Suomi" },
      { code: "el", name: "그리스어", native: "Ελληνικά" },
      { code: "cs", name: "체코어", native: "Čeština" },
      { code: "hu", name: "헝가리어", native: "Magyar" },
      { code: "ro", name: "루마니아어", native: "Română" },
      { code: "uk", name: "우크라이나어", native: "Українська" },
      { code: "he", name: "히브리어", native: "עברית" },
      { code: "fa", name: "페르시아어", native: "فارسی" },
      { code: "ur", name: "우르두어", native: "اردو" },
      { code: "bn", name: "벵골어", native: "বাংলা" },
      { code: "ta", name: "타밀어", native: "தமிழ்" },
      { code: "te", name: "텔루구어", native: "తెలుగు" },
      { code: "mr", name: "마라티어", native: "मराठी" },
      { code: "gu", name: "구자라트어", native: "ગુજરાતી" },
      { code: "kn", name: "칸나다어", native: "ಕನ್ನಡ" },
      { code: "ml", name: "말라얄람어", native: "മലയാളം" },
      { code: "pa", name: "펀자브어", native: "ਪੰਜਾਬੀ" },
      { code: "sw", name: "스와힐리어", native: "Kiswahili" },
      { code: "af", name: "아프리칸스어", native: "Afrikaans" },
      { code: "am", name: "암하라어", native: "አማርኛ" },
      { code: "my", name: "미얀마어", native: "မြန်မာ" },
      { code: "km", name: "크메르어", native: "ខ្មែរ" },
      { code: "lo", name: "라오스어", native: "ລາວ" },
      { code: "ne", name: "네팔어", native: "नेपाली" },
      { code: "si", name: "싱할라어", native: "සිංහල" },
      { code: "mn", name: "몽골어", native: "Монгол" },
      { code: "kk", name: "카자흐어", native: "Қазақ" },
      { code: "uz", name: "우즈베크어", native: "Oʻzbek" },
      { code: "az", name: "아제르바이잔어", native: "Azərbaycan" },
      { code: "ka", name: "조지아어", native: "ქართული" },
      { code: "hy", name: "아르메니아어", native: "Հայերեն" },
      { code: "bg", name: "불가리아어", native: "Български" },
      { code: "hr", name: "크로아티아어", native: "Hrvatski" },
      { code: "sr", name: "세르비아어", native: "Српски" },
      { code: "sk", name: "슬로바키아어", native: "Slovenčina" },
      { code: "et", name: "에스토니아어", native: "Eesti" }
    ];

    const UI_TEXT = {
      ko: {
        title: "HKWB · HK WorldBank",
        tagline: "인류와 기술이 공존하는 차세대 디지털 금융 혁신",
        web3Title: "웹3 디지털 은행",
        web3Desc: "지갑연결 · 송금 · 결재 · 예치 · 보상 · 기본소득 · 스왑 · DEX스왑 · LP스테이킹 · PI수량",
        web3Btn: "웹3 디지털 은행 진입하기",
        internetTitle: "인터넷 은행",
        internetDesc: "계좌 개설 · 입출금 · 즉시이체 · 예금 · 적금 · 대출 · 무료 신용점수 조회",
        internetBtn: "인터넷 은행 진입하기",
        footerRole: "체어맨 이재완",
        footerRefLabel: "추천인",
        footerSupportLabel: "문의",
        statusPrefix: "60개국어 지원 · 현재: "
      },
      en: {
        title: "HKWB · HK WorldBank",
        tagline: "Next-Generation Digital Financial Innovation Where Humanity and Technology Coexist",
        web3Title: "Web3 Digital Bank",
        web3Desc: "Wallet Connect · Transfer · Pay · Deposit · Reward · UBI · Swap · DEX Swap · LP Staking · PI Balance",
        web3Btn: "Enter Web3 Digital Bank",
        internetTitle: "Internet Bank",
        internetDesc: "Open Account · Deposit/Withdraw · Instant Transfer · Savings · Time Deposit · Loan · Free Credit Score",
        internetBtn: "Enter Internet Bank",
        footerRole: "Chairman Lee Jae-wan",
        footerRefLabel: "Referral",
        footerSupportLabel: "Support",
        statusPrefix: "60 Languages · Current: "
      }
    };

    const langToggleBtn = document.getElementById("langToggleBtn");
    const langDropdown = document.getElementById("langDropdown");
    const langSearch = document.getElementById("langSearch");
    const langList = document.getElementById("langList");
    const currentLangLabel = document.getElementById("currentLangLabel");
    const langStatus = document.getElementById("langStatus");

    let activeLang = LANGUAGES_60[0];

    function renderLanguageList(filterText = "") {
      const q = filterText.trim().toLowerCase();
      langList.innerHTML = "";

      const filtered = LANGUAGES_60.filter(
        (item) =>
          item.name.toLowerCase().includes(q) ||
          item.native.toLowerCase().includes(q) ||
          item.code.toLowerCase().includes(q)
      );

      filtered.forEach((lang) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lang-option" + (lang.code === activeLang.code ? " active" : "");
        btn.innerHTML = `<span>${lang.native}</span><span style="opacity:0.65;font-size:10px;">${lang.name}</span>`;
        btn.addEventListener("click", () => selectLanguage(lang));
        langList.appendChild(btn);
      });
    }

    function applyBaseTexts(lang) {
      const dict = UI_TEXT[lang.code] || (lang.code === "ko" ? UI_TEXT.ko : UI_TEXT.en);
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) {
          el.textContent = dict[key];
        }
      });
      currentLangLabel.textContent = lang.native;
      langStatus.textContent = `${dict.statusPrefix}${lang.native} (${LANGUAGES_60.length}개국어)`;
      document.documentElement.lang = lang.code;
    }

    function triggerGoogleTranslate(langCode) {
      const selectEl = document.querySelector("select.goog-te-combo");
      if (selectEl) {
        selectEl.value = langCode === "ko" ? "" : langCode;
        selectEl.dispatchEvent(new Event("change"));
      }
    }

    function selectLanguage(lang) {
      activeLang = lang;
      applyBaseTexts(lang);
      renderLanguageList(langSearch.value);
      triggerGoogleTranslate(lang.code);
      langDropdown.classList.remove("open");
      langToggleBtn.setAttribute("aria-expanded", "false");
    }

    langToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = langDropdown.classList.toggle("open");
      langToggleBtn.setAttribute("aria-expanded", String(isOpen));
      if (isOpen) {
        langSearch.value = "";
        renderLanguageList("");
        langSearch.focus();
      }
    });

    langSearch.addEventListener("input", (e) => {
      renderLanguageList(e.target.value);
    });

    document.addEventListener("click", (e) => {
      if (!langDropdown.contains(e.target) && e.target !== langToggleBtn) {
        langDropdown.classList.remove("open");
        langToggleBtn.setAttribute("aria-expanded", "false");
      }
    });

    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: "ko",
          includedLanguages: LANGUAGES_60.map((l) => l.code).join(","),
          autoDisplay: false
        },
        "google_translate_element"
      );
    }

    document.getElementById("enterWeb3Btn").addEventListener("click", () => {
      alert("웹3 디지털 은행 포털로 진입합니다.");
    });

    document.getElementById("enterInternetBtn").addEventListener("click", () => {
      alert("인터넷 은행 포털로 진입합니다.");
    });

    applyBaseTexts(activeLang);
    renderLanguageList("");
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
