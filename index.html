<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 디지털 금융 혁신</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 상단 헤더: 좌측 HKWB 노란색 로고 / 우측 언어 선택 */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: #0d0b21;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .lang-select {
            background: #1a173b;
            color: #fbbf24;
            border: 1px solid #f59e0b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            max-width: 180px;
        }

        .lang-select option {
            background: #0d0b21;
            color: #ffffff;
        }

        /* 메인 컨텐츠 영역 (중앙 정렬) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 48px;
            color: #fbbf24;
            word-break: keep-all;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            flex: 1;
            min-width: 250px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0d0b21;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
        }

        .btn-secondary {
            background: #1a173b;
            color: #fbbf24;
            border: 1px solid #f59e0b;
        }

        .btn-secondary:hover {
            background: #2d2659;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .brand-logo {
                font-size: 24px;
            }
            .main-title {
                font-size: 30px;
                margin-bottom: 32px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                min-width: unset;
                padding: 16px 24px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
