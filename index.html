<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB — 차세대 디지털 금융 혁신</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: radial-gradient(circle at 50% 42%, #181a1f 0%, #0b0c0f 65%, #060709 100%);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    .topbar {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #f5b921;
      text-decoration: none;
      user-select: none;
    }

    .lang-wrap {
      position: relative;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #9ca3af;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: #ffffff;
      border-color: rgba(245, 185, 33, 0.45);
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 38px;
      width: 180px;
      max-height: 240px;
      overflow-y: auto;
      background: #14161c;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
    }

    .lang-dropdown.open {
      display: block;
    }

    .lang-option {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #d1d5db;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .lang-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* 중앙 메인 히어로 영역 */
    .hero-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 64px;
    }

    .hero-card {
      width: 100%;
      max-width: 780px;
      padding: 56px 36px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(22, 25, 31, 0.85) 0%, rgba(13, 15, 19, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .hero-title {
      font-size: clamp(26px, 4.2vw, 42px);
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.02em;
      color: #f9fafb;
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 400;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 34px;
    }

    .cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-portal {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.16s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-portal:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-portal:active {
      transform: translateY(0);
    }

    .btn-web3 {
      background: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.35);
    }

    .btn-internet {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.28);
    }

    /* 상태 안내 모달/토스트 */
    .status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #181b22;
      color: #f9fafb;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }

    .status-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .topbar {
        padding: 16px 20px;
      }
      .hero-card {
        padding: 40px 20px;
      }
      .cta-group {
        flex-direction: column;
      }
      .btn-portal {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand-logo" id="logoLink">HKWB</a>

    <div class="lang-wrap">
      <button type="button" class="lang-btn" id="langBtn" aria-expanded="false">
        <span>🌐</span>
        <span id="langLabel">60개국어</span>
      </button>
      <div class="lang-dropdown" id="langDropdown" role="menu"></div>
    </div>
  </header>

  <main class="hero-wrapper">
    <section class="hero-card" aria-labelledby="heroTitle">
      <h1 class="hero-title" id="heroTitle">
        인류와 기술이 공존하는<br />
        차세대 디지털 금융 혁신
      </h1>
      <p class="hero-subtitle" id="heroSubtitle">
        10대 글로벌 보안 기술 &amp; AI 기술 기반 글로벌 자율 금융 플랫폼
      </p>

      <div class="cta-group">
        <button type="button" class="btn-portal btn-web3" id="web3Btn">
          Web3 디지털 은행 진입하기
        </button>
        <button type="button" class="btn-portal btn-internet" id="internetBtn">
          인터넷 뱅크 진입하기
        </button>
      </div>
    </section>
  </main>

  <div class="status-toast" id="statusToast" role="status" aria-live="polite"></div>

  <script>
    const languages = [
      "한국어 (KO)", "English (EN)", "日本語 (JA)", "中文简体 (ZH-CN)", "中文繁體 (ZH-TW)",
      "Español (ES)", "Français (FR)", "Deutsch (DE)", "Italiano (IT)", "Português (PT)",
      "Русский (RU)", "العربية (AR)", "हिन्दी (HI)", "Tiếng Việt (VI)", "ไทย (TH)",
      "Bahasa Indonesia (ID)", "Bahasa Melayu (MS)", "Türkçe (TR)", "Nederlands (NL)", "Polski (PL)"
    ];

    const langBtn = document.getElementById("langBtn");
    const langDropdown = document.getElementById("langDropdown");
    const langLabel = document.getElementById("langLabel");
    const toast = document.getElementById("statusToast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2400);
    }

    languages.forEach((lang) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-option";
      btn.textContent = lang;
      btn.addEventListener("click", () => {
        langLabel.textContent = lang.split(" ")[0];
        langDropdown.classList.remove("open");
        langBtn.setAttribute("aria-expanded", "false");
        showToast(`선택된 언어: ${lang}`);
      });
      langDropdown.appendChild(btn);
    });

    langBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = langDropdown.classList.toggle("open");
      langBtn.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("click", () => {
      langDropdown.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    });

    document.getElementById("web3Btn").addEventListener("click", () => {
      showToast("HKWB Web3 디지털 은행으로 이동합니다.");
      // 실제 이동 경로 연결 시 아래 주석 해제:
      // window.location.href = "./web3.html";
    });

    document.getElementById("internetBtn").addEventListener("click", () => {
      showToast("HKWB 인터넷 뱅크로 이동합니다.");
      // 실제 이동 경로 연결 시 아래 주석 해제:
      // window.location.href = "./bank.html";
    });

    document.getElementById("logoLink").addEventListener("click", (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
