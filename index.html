        brandTitle: `HKWB · Web3 Digital & Internet Bank [${langObj.name}]`,
        interestTitle: `Real-Time Accrued Interest · ${langObj.name}`,
        bankTitle: `Internet Bank Demo · ${langObj.name}`,

    function renderAll() {
      const langObj = LANGUAGES[currentIndex];
      currentPack = buildPackForLang(currentIndex, langObj);
      document.documentElement.lang = langObj.code;
      langStatus.textContent = `${currentIndex + 1}. ${langObj.name}`;

      document.getElementById("brandTitle").textContent = currentPack.brandTitle;
      document.getElementById("langLabel").textContent = currentPack.langLabel;
      document.getElementById("interestTitle").textContent = currentPack.interestTitle;
      document.getElementById("interestSub").textContent = currentPack.interestSub;
      document.getElementById("bankTitle").textContent = currentPack.bankTitle;
      document.getElementById("txTarget").placeholder = currentPack.targetPlaceholder;

      document.getElementById("tabBtnFaq").textContent = currentPack.tabs.faq;

      const netContainer = document.getElementById("tenNetworks");
      netContainer.innerHTML = "";
      currentPack.networks.forEach(([title, desc], i) => {
        const div = document.createElement("div");
        div.className = "net-item";
        div.innerHTML = `<strong>${i + 1}. ${title}</strong><span class="muted">${desc}</span>`;

      });

      document.getElementById("whitepaper").innerHTML =
        `<h2>${currentPack.whitepaperTitle}</h2>` +
        currentPack.whitepaperSections.map(([h, p]) => `<div class="wp-section"><h3>${h}</h3><p>${p}</p></div>`).join("");

      document.getElementById("policies").innerHTML =
        `<h2>${currentPack.policiesTitle}</h2>` +
        currentPack.policySections.map(([h, p]) => `<div class="wp-section"><h3>${h}</h3><p>${p}</p></div>`).join("");

      document.getElementById("compliance").innerHTML =
        `<h2>${currentPack.complianceTitle}</h2><p class="muted">${currentPack.complianceBody}</p>`;

      document.getElementById("hub").innerHTML =
        `<h2>${currentPack.hubTitle}</h2><div class="hub-list">` +
        currentPack.hubs.map(([h, d]) => `<div class="hub-box"><strong>${h}</strong><br /><span class="muted">${d}</span></div>`).join("") +

      document.getElementById("faq").innerHTML =
        `<h2>${currentPack.faqTitle}</h2>` +
        currentPack.faqs.map(([q, a], i) => `<div class="faq-item"><div class="faq-q">${q.startsWith("Q") || q.startsWith("F") || q.startsWith("P") ? q : `Q${i + 1}. ${q}`}</div><div class="faq-a">${a}</div></div>`).join("");

    langSelect.addEventListener("change", () => {
      currentIndex = Number(langSelect.value);
      renderAll();
      appendLog(`[I18N #${currentIndex + 1}] ${LANGUAGES[currentIndex].name}`);
    });

    let interestVal = 14992.00;
    const liveInterestEl = document.getElementById("liveInterest");
    const fmt = new Intl.NumberFormat("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    setInterval(() => {
      interestVal += 0.13;
      liveInterestEl.textContent = `₩${fmt.format(interestVal)}`;
    }, 1000);

    function appendLog(msg) {
      const box = document.getElementById("txLog");
      const now = new Date().toLocaleTimeString("ko-KR");
      box.innerHTML += `<br />[${now}] ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    function runBanking(actionKey) {
      const amt = Number(document.getElementById("txAmount").value || 0);
      const target = document.getElementById("txTarget").value.trim() || "DEFAULT-ADDR";
      if (amt <= 0) {
        appendLog("[WARN] Amount > 0");
        return;
      }
      const label = currentPack.txPrefix[actionKey] || actionKey;
      appendLog(`[${label}] ₩${new Intl.NumberFormat("ko-KR").format(amt)} → ${target} | ${currentPack.txPass}`);
    }

    function showTab(id, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      btn.classList.add("active");
    }

    renderAll();
    document.getElementById("txLog").innerHTML = KO_PACK.initLog;
