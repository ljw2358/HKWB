<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB · HK WorldBank</title>
  <style>
    :root {
      --bg-top: #070b1a;
      --bg-mid: #101633;
      --bg-bottom: #080c1c;
      --card-bg: rgba(15, 22, 50, 0.88);
      --card-border: rgba(148, 163, 184, 0.24);
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --gold-1: #fbbf24;
      --gold-2: #d97706;
      --blue-1: #3b82f6;
      --blue-2: #2563eb;
      --purple-glow: rgba(124, 58, 237, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 20% 15%, var(--purple-glow), transparent 45%),
        radial-gradient(circle at 82% 20%, rgba(37, 99, 235, 0.2), transparent 45%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px 28px;
    }

    .topbar {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .lang-select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(23, 34, 78, 0.92) 0%, rgba(39, 27, 78, 0.92) 100%);
      border: 1px solid rgba(167, 139, 250, 0.28);
      border-radius: 18px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: clamp(28px, 4.6vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .brand-title .dot {
      color: var(--gold-1);
      margin: 0 6px;
    }

    .tagline {
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 600;
      background: linear-gradient(90deg, #fde68a 0%, #93c5fd 50%, #ddd6fe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .portal-card.web3 {
      border-color: rgba(251, 191, 36, 0.35);
    }

    .portal-card.internet {
      border-color: rgba(59, 130, 246, 0.35);
    }

    .card-heading {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .btn-web3 {
      background: linear-gradient(90deg, var(--gold-2) 0%, var(--gold-1) 100%);
      color: #111827;
    }

    .btn-internet {
      background: linear-gradient(90deg, var(--blue-2) 0%, var(--blue-1) 100%);
      color: #ffffff;
    }

    .info-panel {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 22px;
      display: none;
      margin-bottom: 24px;
    }

    .info-panel.active {
      display: block;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-1);
    }

    .close-btn {
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-sub);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .module-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      color: #e2e8f0;
    }

    .rate-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .rate-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .rate-period {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .rate-val {
      font-size: 15px;
      font-weight: 700;
      color: #fde68a;
    }

    footer {
      width: 100%;
      max-width: 1120px;
      margin: 16px auto 0;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .portal-grid {
        grid-template-columns: 1fr;
      }

      .rate-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div>
    <div class="topbar">
      <select class="lang-select" id="langSelect" aria-label="언어 선택">
        <option value="ko" selected>한국어</option>
        <option value="en">English (60+ Languages)</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <main class="container">
      <section class="hero-banner">
        <h1 class="brand-title">HKWB<span class="dot">·</span>HK WorldBank</h1>
        <p class="tagline" id="taglineText">인류와 기술이 공존하는 차세대 디지털 금융 혁신</p>
      </section>

      <section class="portal-grid">
        <article class="portal-card web3">
          <h2 class="card-heading" id="web3Title">웹3 디지털 은행</h2>
          <p class="card-desc" id="web3Desc">안쪽 열기: 10대 분산 연동망 · 스왑 · 예치 · UBI</p>
          <button class="btn btn-web3" type="button" onclick="openPortal('web3')" id="web3Btn">
            웹3 디지털 은행 진입하기
          </button>
        </article>

        <article class="portal-card internet">
          <h2 class="card-heading" id="internetTitle">인터넷 은행</h2>
          <p class="card-desc" id="internetDesc">안쪽 열기: 입금·출금·송금·예치·적금·대출·신용점수</p>
          <button class="btn btn-internet" type="button" onclick="openPortal('internet')" id="internetBtn">
            인터넷 은행 진입하기
          </button>
        </article>
      </section>

      <section class="info-panel" id="infoPanel">
        <div class="panel-header">
          <h3 class="panel-title" id="panelTitle">포털 상세 안내</h3>
          <button class="close-btn" type="button" onclick="closePortal()">닫기</button>
        </div>
        <div id="panelBody"></div>
      </section>
    </main>
  </div>

  <footer>
    <div>HKWB · HK WorldBank | 체어맨 이재완</div>
    <div>추천인: ljw2358 | 문의: support@hkwb.world</div>
  </footer>

  <script>
    const translations = {
      ko: {
        tagline: "인류와 기술이 공존하는 차세대 디지털 금융 혁신",
        web3Title: "웹3 디지털 은행",
        web3Desc: "안쪽 열기: 10대 분산 연동망 · 스왑 · 예치 · UBI",
        web3Btn: "웹3 디지털 은행 진입하기",
        internetTitle: "인터넷 은행",
        internetDesc: "안쪽 열기: 입금·출금·송금·예치·적금·대출·신용점수",
        internetBtn: "인터넷 은행 진입하기"
      },
      en: {
        tagline: "Next-Generation Digital Financial Innovation Where Humanity and Technology Coexist",
        web3Title: "Web3 Digital Bank",
        web3Desc: "Open Inner Portal: 10 Distributed Networks · Swap · Deposit · UBI",
        web3Btn: "Enter Web3 Digital Bank",
        internetTitle: "Internet Bank",
        internetDesc: "Open Inner Portal: Deposit · Withdrawal · Transfer · Savings · Loan · Credit Score",
        internetBtn: "Enter Internet Bank"
      },
      ja: {
        tagline: "人類と技術が共存する次世代デジタル金融イノベーション",
        web3Title: "Web3 デジタル銀行",
        web3Desc: "内部を開く: 10大分散連動網 · スワップ · 預け入れ · UBI",
        web3Btn: "Web3 デジタル銀行へ進む",
        internetTitle: "インターネット銀行",
        internetDesc: "内部を開く: 入金・出金・送金・預金・積立・融資・信用スコア",
        internetBtn: "インターネット銀行へ進む"
      },
      zh: {
        tagline: "人类与技术共存的新一代数字金融创新",
        web3Title: "Web3 数字银行",
        web3Desc: "打开内层: 十大分布式联动网络 · 兑换 · 存入 · UBI",
        web3Btn: "进入 Web3 数字银行",
        internetTitle: "互联网银行",
        internetDesc: "打开内层: 存款 · 取款 · 转账 · 定期 · 贷款 · 信用评分",
        internetBtn: "进入互联网银行"
      }
    };

    const tenModules = [
      "지갑연결", "송금", "결재", "예치", "보상",
      "기본소득", "스왑", "DEX스왑", "LP스테이킹", "PI수량"
    ];

    document.getElementById("langSelect").addEventListener("change", (e) => {
      const t = translations[e.target.value] || translations.ko;
      document.getElementById("taglineText").textContent = t.tagline;
      document.getElementById("web3Title").textContent = t.web3Title;
      document.getElementById("web3Desc").textContent = t.web3Desc;
      document.getElementById("web3Btn").textContent = t.web3Btn;
      document.getElementById("internetTitle").textContent = t.internetTitle;
      document.getElementById("internetDesc").textContent = t.internetDesc;
      document.getElementById("internetBtn").textContent = t.internetBtn;
    });

    function openPortal(type) {
      const panel = document.getElementById("infoPanel");
      const title = document.getElementById("panelTitle");
      const body = document.getElementById("panelBody");

      if (type === "web3") {
        title.textContent = "웹3 디지털 은행 · 10대 분산 연동망 & 예치 수익률";
        body.innerHTML = `
          <div class="module-tags">
            ${tenModules.map((m) => `<span class="tag">${m}</span>`).join("")}
          </div>
          <div class="rate-grid">
            <div class="rate-box"><div class="rate-period">6개월</div><div class="rate-val">8% ~ 12%</div></div>
            <div class="rate-box"><div class="rate-period">1년</div><div class="rate-val">12% ~ 18%</div></div>
            <div class="rate-box"><div class="rate-period">2년</div><div class="rate-val">16% ~ 24%</div></div>
            <div class="rate-box"><div class="rate-period">3년</div><div class="rate-val">20% ~ 31.4%</div></div>
          </div>
        `;
      } else {
        title.textContent = "인터넷 은행 · 입출금 · 송금 · 예치 · 적금 · 대출 · 신용점수";
        body.innerHTML = `
          <p class="card-desc" style="text-align:left;">
            HKWB 산하 인터넷 은행 포털입니다. 입금, 출금, 송금, 예치, 적금, 대출 및 신용점수 조회 기능을 한곳에서 연결합니다.
          </p>
        `;
      }

      panel.classList.add("active");
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closePortal() {
      document.getElementById("infoPanel").classList.remove("active");
    }
  </script>
</body>
</html>
