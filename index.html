<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pageTitle">HKWB · 웹3 디지털 은행</title>
  <style>
    :root {
      --bg: #070b14;
      --surface: #0f172a;
      --card: #162033;
      --card-hover: #1d2b45;
      --border: #283856;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --green: #22c55e;
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --purple: #a855f7;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #13203b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 18px 64px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* 상단 헤더 및 60개 언어 선택기 */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.25rem;
      color: var(--gold-bright);
      letter-spacing: 0.5px;
    }

    .lang-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-box label {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    .lang-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.95rem;
      min-width: 240px;
      cursor: pointer;
      outline: none;
    }

    .lang-select:focus {
      border-color: var(--gold);
    }

    /* 개인 자산 대시보드 */
    .dashboard {
      background: linear-gradient(145deg, #17233b 0%, #10192b 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 32px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .dash-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dash-title {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(7, 11, 20, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 20px;
    }

    .stat-label {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.95rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .stat-value.gold {
      color: var(--gold-bright);
    }

    .stat-value.green {
      color: #4ade80;
    }

    .stat-unit {
      font-size: 0.95rem;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 600;
    }

    .dash-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .btn-gold {
      background: var(--gold-bright);
      color: #090d16;
    }

    .btn-surface {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* 10대 분산 연동망: PC 2열 x 5행 (2x5), 핸드폰 5열 x 2행 (5x2) */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .section-sub {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .network-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* PC: 2 x 5 */
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (max-width: 767px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .network-grid {
        grid-template-columns: repeat(5, 1fr); /* 모바일/핸드폰: 5 x 2 */
        gap: 8px;
      }
    }

    .net-tile {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      overflow: hidden;
    }

    /* 블라인드 셔터 연출 */
    .net-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.06) 0px,
        rgba(255, 255, 255, 0.06) 3px,
        transparent 3px,
        transparent 9px
      );
      opacity: 0.45;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .net-tile:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: var(--tile-color, var(--gold));
    }

    .net-tile:hover::before {
      opacity: 0.12;
    }

    .net-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .net-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      background: var(--tile-grad);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .net-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
    }

    .net-desc {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .net-action-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--tile-color, var(--gold-bright));
    }

    @media (max-width: 767px) {
      .net-tile {
        padding: 10px 6px;
        border-radius: 12px;
        text-align: center;
        align-items: center;
        gap: 6px;
      }

      .net-top {
        flex-direction: column;
        gap: 6px;
      }

      .net-logo {
        width: 34px;
        height: 34px;
        font-size: 1rem;
        border-radius: 9px;
      }

      .net-name {
        font-size: 0.74rem;
        line-height: 1.2;
        word-break: keep-all;
      }

      .net-desc,
      .net-action-tag {
        display: none;
      }
    }

    /* 고객센터 AI 삐니 + 유튜브 & 틱톡 */
    .support-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 18px;
      margin-bottom: 28px;
    }

    @media (max-width: 820px) {
      .support-row {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .social-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-yt {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
    }

    .btn-tt {
      background: linear-gradient(135deg, #06b6d4, #ec4899);
      color: #fff;
    }

    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    /* 인터랙티브 모달 (송금 · 모듈 실행 · 고객센터 AI 삐니) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 0.96rem;
      outline: none;
    }

    .status-msg {
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 상단 언어 전환 바 -->
    <header class="topbar">
      <div class="brand-mark">
        <span>HKWB</span>
        <span style="font-size:0.85rem;color:var(--muted);font-weight:600;" data-i18n="divisionTag">웹3 디지털 은행</span>
      </div>

      <div class="lang-box">
        <label for="langSelect" data-i18n="langLabel">60개 언어 선택</label>
        <select id="langSelect" class="lang-select" aria-label="언어 선택"></select>
      </div>
    </header>

    <!-- 개인 자산 대시보드 (실시간 숫자 변동) -->
    <section class="dashboard" aria-label="개인 자산 대시보드">
      <div class="dash-head">
        <h1 class="dash-title" data-i18n="dashTitle">개인 자산 대시보드</h1>
        <span class="live-pill">
          <span class="live-dot"></span>
          <span data-i18n="liveBadge">실시간 반영 중</span>
        </span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label" data-i18n="holdingLabel">보유 수량</div>
          <div class="stat-value gold">
            <span id="holdingAmount">314,159.000000</span>
            <span class="stat-unit">PI / HK</span>
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-label" data-i18n="interestLabel">실시간 누적 이자</div>
          <div class="stat-value green">
            <span id="accruedInterest">12,450,894.843751</span>
            <span class="stat-unit">HK</span>
          </div>
        </div>
      </div>

      <div class="dash-actions">
        <button type="button" class="btn btn-gold" id="openTransferBtn" data-i18n="transferBtn">계좌 송금하기</button>
        <button type="button" class="btn btn-surface" id="openPiniBtn" data-i18n="piniBtn">고객센터 AI 삐니</button>
      </div>
    </section>

    <!-- 10대 분산 연동망 -->
    <section aria-label="10대 분산 연동망">
      <div class="section-header">
        <h2 class="section-title" data-i18n="netTitle">10대 분산 연동망</h2>
        <span class="section-sub" data-i18n="netSub">PC 2×5 · 모바일 5×2 반응형 그리드</span>
      </div>

      <div id="networkGrid" class="network-grid"></div>
    </section>

    <!-- 고객센터 AI 삐니 + 유튜브 & 틱톡 -->
    <section class="support-row">
      <div class="panel">
        <h2 class="panel-title">
          <span>🤖</span>
          <span data-i18n="piniTitle">고객센터 AI 삐니</span>
        </h2>
        <p class="panel-desc" data-i18n="piniDesc">송금, 예치, 지갑 연결 및 10대 분산 연동망 이용 안내를 즉시 도와드립니다.</p>
        <button type="button" class="btn btn-gold" id="openPiniCardBtn" data-i18n="piniOpenBtn">삐니와 대화 시작하기</button>
      </div>

      <div class="panel">
        <h2 class="panel-title">
          <span>📡</span>
          <span data-i18n="socialTitle">공식 채널</span>
        </h2>
        <p class="panel-desc" data-i18n="socialDesc">유튜브와 틱톡에서 최신 소식과 가이드를 확인하세요.</p>
        <div class="social-btns">
          <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="btn btn-yt" data-i18n="youtubeBtn">유튜브</a>
          <a href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" class="btn btn-tt" data-i18n="tiktokBtn">틱톡</a>
        </div>
      </div>
    </section>

    <footer class="footer-bar">
      <div><span data-i18n="referrerLabel">추천인</span>: <strong>ljw2358</strong></div>
      <div>support@hkwb.world</div>
    </footer>
  </div>

  <!-- 계좌 송금 및 모듈 실행 모달 -->
  <div id="actionModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle" class="modal-title">계좌 송금하기</h3>
        <button type="button" class="close-btn" id="closeModalBtn" aria-label="닫기">✕</button>
      </div>
      <form id="actionForm">
        <div class="field">
          <label for="recipientInput" id="recipientLabel">받는 계좌 / 지갑 주소</label>
          <input id="recipientInput" type="text" required placeholder="HK-01-ljw2358" />
        </div>
        <div class="field">
          <label for="amountInput" id="amountLabel">송금 수량</label>
          <input id="amountInput" type="number" step="0.000001" min="0.000001" value="100.000000" required />
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;" id="submitActionBtn">실행하기</button>
        <div id="modalStatus" class="status-msg"></div>
      </form>
    </div>
  </div>

  <!-- 고객센터 AI 삐니 모달 -->
  <div id="piniModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="piniModalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="piniModalTitle" class="modal-title">고객센터 AI 삐니</h3>
        <button type="button" class="close-btn" id="closePiniBtn" aria-label="닫기">✕</button>
      </div>
      <div class="field">
        <label for="piniTopicSelect" id="piniTopicLabel">문의 항목 선택</label>
        <select id="piniTopicSelect">
          <option value="transfer" id="optTransfer">계좌 송금 반응 및 처리 문의</option>
          <option value="deposit" id="optDeposit">예치 이자 및 실시간 반영 문의</option>
          <option value="network" id="optNetwork">10대 분산 연동망 안내</option>
        </select>
      </div>
      <button type="button" class="btn btn-gold" style="width:100%;" id="askPiniBtn">삐니 답변 받기</button>
      <div id="piniReply" class="status-msg"></div>
    </div>
  </div>

    // 선택한 언어 코드를 화면/모달/문구 전체에 반영하는 딕셔너리 생성기
    function getLocalePack(code) {
      if (CORE_I18N[code]) return CORE_I18N[code];
      const base = code.split("-")[0];
      if (CORE_I18N[base]) return CORE_I18N[base];

      const langMeta = LANGUAGES.find((l) => l.code === code) || LANGUAGES[1];
      const en = CORE_I18N.en;
      return {
        ...en,
        pageTitle: `HKWB · ${langMeta.label}`,
        divisionTag: `${en.divisionTag} (${code})`,
        langLabel: `${langMeta.label} · ${code}`,
        liveBadge: `${en.liveBadge} [${code}]`,
        piniTitle: `${en.piniTitle} (${langMeta.label})`
      };
    }

    let currentLang = "ko";
    let holdings = 314159.0;
    let accruedInterest = 12450894.843751;
    let modalMode = "transfer";

    const langSelect = document.getElementById("langSelect");
    const holdingEl = document.getElementById("holdingAmount");
    const interestEl = document.getElementById("accruedInterest");
    const networkGrid = document.getElementById("networkGrid");

    // 60개 언어 드롭다운 채우기
    LANGUAGES.forEach((lang) => {
      const opt = document.createElement("option");
      opt.value = lang.code;
      opt.textContent = lang.label;
      langSelect.appendChild(opt);
    });

    // 실시간 숫자 움직임(보유 수량 및 실시간 누적 이자)
    function formatFixed6(num) {
      return num.toLocaleString("en-US", {
        minimumFractionDigits: 6,
        maximumFractionDigits: 6
      });
    }

    function renderNumbers() {
      holdingEl.textContent = formatFixed6(holdings);
      interestEl.textContent = formatFixed6(accruedInterest);
    }

    setInterval(() => {
      accruedInterest += 0.004321;
      holdings += 0.000012;
      renderNumbers();
    }, 250);

    // 10대 분산 연동망 타일 렌더링
    function renderModules(pack) {
      networkGrid.innerHTML = "";
      TEN_MODULES.forEach((mod) => {
        const [title, desc, tag] = pack.modules[mod.id] || CORE_I18N.en.modules[mod.id];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "net-tile";
        btn.style.setProperty("--tile-color", mod.color);
        btn.style.setProperty("--tile-grad", mod.grad);
        btn.innerHTML = `
          <div class="net-top">
            <div class="net-logo">${mod.icon}</div>
            <div class="net-name">${title}</div>
          </div>
          <div class="net-desc">${desc}</div>
          <div class="net-action-tag">${tag} →</div>
        `;
        btn.addEventListener("click", () => {
          if (mod.actionType === "transfer") {
            openActionModal("transfer", title);
          } else {
            openActionModal("module", title);
          }
        });
        networkGrid.appendChild(btn);
      });
    }

    // 화면 전체 언어 적용
    function applyLanguage(code) {
      currentLang = code;
      const pack = getLocalePack(code);
      document.documentElement.lang = code;
      document.documentElement.dir = RTL_CODES.has(code.split("-")[0]) ? "rtl" : "ltr";
      document.title = pack.pageTitle;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key] !== undefined) {
          el.textContent = pack[key];
        }
      });

      document.getElementById("recipientLabel").textContent = pack.recipientLabel;
      document.getElementById("amountLabel").textContent = pack.amountLabel;
      document.getElementById("submitActionBtn").textContent = pack.submitActionBtn;
      document.getElementById("closeModalBtn").setAttribute("aria-label", pack.closeLabel);
      document.getElementById("closePiniBtn").setAttribute("aria-label", pack.closeLabel);
      document.getElementById("piniTopicLabel").textContent = pack.piniTopicLabel;
      document.getElementById("optTransfer").textContent = pack.optTransfer;
      document.getElementById("optDeposit").textContent = pack.optDeposit;
      document.getElementById("optNetwork").textContent = pack.optNetwork;
      document.getElementById("askPiniBtn").textContent = pack.askPiniBtn;

      langSelect.value = code;
      renderModules(pack);

      try {
        localStorage.setItem("hkwb_web3_lang", code);
      } catch (_e) {
        // 저장소 제한 환경 무시
      }
    }

    // 모달 제어
    const actionModal = document.getElementById("actionModal");
    const piniModal = document.getElementById("piniModal");
    const modalStatus = document.getElementById("modalStatus");
    const piniReply = document.getElementById("piniReply");

    function openActionModal(mode, customTitle) {
      modalMode = mode;
      const pack = getLocalePack(currentLang);
      document.getElementById("modalTitle").textContent = customTitle || pack.transferBtn;
      document.getElementById("amountFieldWrap")?.remove();
      const amountInput = document.getElementById("amountInput");
      amountInput.closest(".field").style.display = mode === "transfer" ? "block" : "none";
      document.getElementById("recipientInput").closest(".field").style.display = mode === "transfer" ? "block" : "none";
      modalStatus.className = "status-msg";
      modalStatus.textContent = "";
      actionModal.classList.add("open");
    }

    function closeActionModal() {
      actionModal.classList.remove("open");
    }

    function openPiniModal() {
      piniReply.className = "status-msg";
      piniReply.textContent = "";
      piniModal.classList.add("open");
    }

    function closePiniModal() {
      piniModal.classList.remove("open");
    }

    document.getElementById("openTransferBtn").addEventListener("click", () => {
      const pack = getLocalePack(currentLang);
      openActionModal("transfer", pack.transferBtn);
    });

    document.getElementById("closeModalBtn").addEventListener("click", closeActionModal);
    document.getElementById("closePiniBtn").addEventListener("click", closePiniModal);
    document.getElementById("openPiniBtn").addEventListener("click", openPiniModal);
    document.getElementById("openPiniCardBtn").addEventListener("click", openPiniModal);

    document.getElementById("actionForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const pack = getLocalePack(currentLang);
      if (modalMode === "transfer") {
        const amt = parseFloat(document.getElementById("amountInput").value || "0");
        if (amt > 0) {
          holdings = Math.max(0, holdings - amt);
          accruedInterest += amt * 0.01;
          renderNumbers();
        }
        modalStatus.textContent = pack.transferDone;
      } else {
        modalStatus.textContent = pack.moduleDone;
      }
      modalStatus.classList.add("show");
    });

    document.getElementById("askPiniBtn").addEventListener("click", () => {
      const pack = getLocalePack(currentLang);
      const topic = document.getElementById("piniTopicSelect").value;
      piniReply.textContent = pack.piniAnswers[topic] || pack.piniAnswers.transfer;
      piniReply.classList.add("show");
    });

    langSelect.addEventListener("change", (e) => {
      applyLanguage(e.target.value);
    });

    renderNumbers();
    let savedCode = "ko";
    try {
      savedCode = localStorage.getItem("hkwb_web3_lang") || "ko";
    } catch (_e) {
      savedCode = "ko";
    }
    applyLanguage(savedCode);
  </script>
