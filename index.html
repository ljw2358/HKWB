<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB · HK WorldBank</title>
  <style>
    :root {
      --bg-main: #06040e;
      --bg-panel: #120d26;
      --bg-card: #191336;
      --bg-card-hover: #241b4b;
      --gold-light: #fff1b8;
      --gold: #f5c451;
      --gold-dark: #c58417;
      --blue: #3b82f6;
      --blue-soft: #93c5fd;
      --emerald: #34d399;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --line-gold: rgba(245, 196, 81, 0.38);
      --line-blue: rgba(147, 197, 253, 0.35);
      --line-soft: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans", sans-serif;
      background: radial-gradient(circle at 50% 10%, #271752 0%, var(--bg-main) 65%, #030207 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    /* 상단 언어바 */
    .top-lang-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .lang-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(25, 19, 54, 0.92);
      border: 1px solid var(--line-gold);
      border-radius: 12px;
      padding: 8px 14px;
    }

    .lang-box label {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }

    select, input, button {
      font-family: inherit;
      color: var(--text);
    }

    select#langSelect {
      background: #0c081c;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      max-width: 250px;
      cursor: pointer;
    }

    /* 초대형 메인 타이틀 & 슬로건 (코인 카드 제거) */
    .hero-brand {
      text-align: center;
      padding: 28px 16px 38px;
      margin-bottom: 24px;
      background: linear-gradient(145deg, rgba(44, 24, 92, 0.72), rgba(14, 10, 30, 0.92));
      border: 1px solid var(--line-gold);
      border-radius: 24px;
    }

    .hero-title {
      font-size: clamp(2.6rem, 6.8vw, 4.7rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #ffffff, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    .hero-slogan {
      font-size: clamp(1.25rem, 3.1vw, 2.05rem);
      font-weight: 800;
      line-height: 1.38;
      background: linear-gradient(90deg, var(--blue-soft), var(--gold-light), #e9d5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 860px;
      margin: 0 auto;
    }

    /* 웹3 디지털 은행 / 인터넷 은행 진입 버튼 */
    .entry-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    @media (max-width: 680px) {
      .entry-grid {
        grid-template-columns: 1fr;
      }
    }

    .entry-card {
      background: var(--bg-card);
      border: 1px solid var(--line-gold);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .entry-card.internet {
      border-color: var(--line-blue);
    }

    .entry-card.active.web3 {
      border-color: var(--gold);
      box-shadow: 0 12px 28px rgba(245, 196, 81, 0.16);
    }

    .entry-card.active.internet {
      border-color: var(--blue-soft);
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.18);
    }

    .entry-card h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .entry-card p {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .btn-enter {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-enter.web3 {
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      color: #161003;
    }

    .btn-enter.internet {
      background: linear-gradient(90deg, #60a5fa, var(--blue));
      color: #ffffff;
    }

    /* 분리된 채널 패널 */
    .channel-panel {
      background: var(--bg-panel);
      border: 1px solid var(--line-gold);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel-head h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold);
    }

    .net-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .net-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .net-btn.active, .net-btn:hover {
      border-color: var(--gold);
      background: var(--bg-card-hover);
    }

    .net-btn strong {
      display: block;
      font-size: 0.9rem;
      color: var(--gold-light);
    }

    .net-btn span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .box {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 16px;
    }

    .box h4 {
      font-size: 1.02rem;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .field select, .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0c081b;
      font-size: 0.92rem;
    }

    .calc-box {
      background: rgba(7, 5, 16, 0.88);
      border: 1px dashed rgba(245, 196, 81, 0.45);
      border-radius: 10px;
      padding: 11px;
      margin: 12px 0;
      font-size: 0.86rem;
      color: var(--gold-light);
    }

    .gold-btn {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--gold), var(--gold-dark));
      color: #161003;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .six-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      .six-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .six-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    .six-btn.active, .six-btn:hover {
      border-color: var(--blue-soft);
      background: var(--bg-card-hover);
    }

    .six-btn strong {
      display: block;
      font-size: 0.94rem;
      color: var(--gold-light);
      margin-bottom: 2px;
    }

    .six-btn span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .rate-tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.86rem;
    }

    .rate-tbl th, .rate-tbl td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-soft);
      text-align: left;
    }

    .rate-tbl th {
      color: var(--gold);
    }

    .rate-em {
      color: var(--emerald);
      font-weight: 800;
    }

    .credit-box {
      background: linear-gradient(125deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.16));
      border: 1px solid rgba(52, 211, 153, 0.45);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .credit-score {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--emerald);
    }

    /* 하단 고정 4칸 바 */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: rgba(10, 7, 22, 0.96);
      border-top: 1px solid var(--line-gold);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 60;
      backdrop-filter: blur(12px);
    }

    .bottom-nav button {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .bottom-nav button.active, .bottom-nav button:hover {
      color: var(--gold);
      background: rgba(245, 196, 81, 0.08);
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 2, 10, 0.84);
      z-index: 90;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 82vh;
      overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--line-gold);
      border-radius: 20px;
      padding: 20px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .modal-top h3 {
      color: var(--gold);
      font-size: 1.1rem;
    }

    .close-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .menu-tile {
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    .menu-tile:hover {
      border-color: var(--gold);
    }

    .menu-tile strong {
      display: block;
      color: var(--gold-light);
      font-size: 0.9rem;
    }

    .menu-tile span {
      font-size: 0.76rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 언어 선택 -->
    <div class="top-lang-bar">
      <div class="lang-box">
        <label for="langSelect" data-i18n="langLabel">60개국어 언어 선택</label>
        <select id="langSelect" aria-label="60개국어 언어 선택"></select>
      </div>
    </div>

    <!-- 초대형 브랜드 타이틀 & 슬로건 (코인 카드 없음) -->
    <section class="hero-brand" id="topBrandSection">
      <h1 class="hero-title" data-i18n="heroTitle">HKWB · HK WorldBank</h1>
      <p class="hero-slogan" data-i18n="heroSlogan">인류와 기술이 공존하는 차세대 디지털 금융 혁신</p>
    </section>

    <!-- 진입 버튼 2개: 웹3 디지털 은행 / 인터넷 은행 -->
    <section class="entry-grid">
      <div class="entry-card web3 active" id="cardWeb3">
        <div>
          <h2 data-i18n="web3Title">웹3 디지털 은행</h2>
          <p data-i18n="web3Desc">10대 분산 연동망과 스왑·예치·UBI 채널</p>
        </div>
        <button type="button" class="btn-enter web3" onclick="switchChannel('web3')" data-i18n="web3Btn">
          웹3 디지털 은행 진입하기
        </button>
      </div>

      <div class="entry-card internet" id="cardInternet">
        <div>
          <h2 data-i18n="internetTitle">인터넷 은행</h2>
          <p data-i18n="internetDesc">입금·출금·송금·예치·적금·대출 및 신용점수 채널</p>
        </div>
        <button type="button" class="btn-enter internet" onclick="switchChannel('internet')" data-i18n="internetBtn">
          인터넷 은행 진입하기
        </button>
      </div>
    </section>

    <!-- 웹3 디지털 은행 영역 -->
    <main class="channel-panel" id="web3Panel">
      <div class="panel-head">
        <h3 data-i18n="web3PanelTitle">웹3 디지털 은행 — 10대 분산 연동망</h3>
      </div>

      <div class="net-grid" id="netGrid"></div>

      <div class="two-col">
        <div class="box">
          <h4 data-i18n="swapBoxTitle">스왑 &amp; DEX 스왑</h4>
          <div class="field">
            <label for="fromAsset" data-i18n="fromLabel">출발 자산</label>
            <select id="fromAsset" onchange="calcSwap()"></select>
          </div>
          <div class="field">
            <label for="toAsset" data-i18n="toLabel">도착 자산</label>
            <select id="toAsset" onchange="calcSwap()"></select>
          </div>
          <div class="field">
            <label for="swapQty" data-i18n="qtyLabel">수량</label>
            <input type="number" id="swapQty" value="100" min="0" step="any" oninput="calcSwap()" />
          </div>
          <div class="calc-box" id="swapCalcOut"></div>
          <button type="button" class="gold-btn" onclick="calcSwap()" data-i18n="calcBtn">계산 반영</button>
        </div>

        <div class="box">
          <h4 data-i18n="w3DepBoxTitle">기간별 예치 이자율</h4>
          <div class="field">
            <label for="w3Term" data-i18n="termLabel">예치 기간</label>
            <select id="w3Term" onchange="calcW3Dep()"></select>
          </div>
          <div class="field">
            <label for="w3Amt" data-i18n="amtLabel">예치 금액 (KRW)</label>
            <input type="number" id="w3Amt" value="10000000" min="0" step="10000" oninput="calcW3Dep()" />
          </div>
          <div class="calc-box" id="w3DepOut"></div>
          <button type="button" class="gold-btn" onclick="calcW3Dep()" data-i18n="calcBtn">계산 반영</button>
        </div>
      </div>
    </main>

    <!-- 인터넷 은행 영역 -->
    <section class="channel-panel" id="internetPanel" style="display:none;">
      <div class="panel-head">
        <h3 data-i18n="internetPanelTitle">인터넷 은행 — 6대 기능 · 예치 이자율 · 신용점수</h3>
      </div>

      <div class="six-grid">
        <button type="button" class="six-btn active" data-fn="deposit" onclick="pickFn('deposit')">
          <strong data-i18n="fn1">1. 입금</strong>
          <span>DEPOSIT</span>
        </button>
        <button type="button" class="six-btn" data-fn="withdraw" onclick="pickFn('withdraw')">
          <strong data-i18n="fn2">2. 출금</strong>
          <span>WITHDRAW</span>
        </button>
        <button type="button" class="six-btn" data-fn="transfer" onclick="pickFn('transfer')">
          <strong data-i18n="fn3">3. 송금</strong>
          <span>TRANSFER</span>
        </button>
        <button type="button" class="six-btn" data-fn="staking" onclick="pickFn('staking')">
          <strong data-i18n="fn4">4. 예치</strong>
          <span>TERM DEPOSIT</span>
        </button>
        <button type="button" class="six-btn" data-fn="savings" onclick="pickFn('savings')">
          <strong data-i18n="fn5">5. 적금</strong>
          <span>SAVINGS</span>
        </button>
        <button type="button" class="six-btn" data-fn="loan" onclick="pickFn('loan')">
          <strong data-i18n="fn6">6. 대출</strong>
          <span>LOAN</span>
        </button>
      </div>

      <div class="two-col">
        <div class="box">
          <h4 data-i18n="bankRateTitle">예치 이자율 안내</h4>
          <div class="field">
            <label for="bankTerm" data-i18n="termLabel">예치 기간</label>
            <select id="bankTerm" onchange="calcBank()"></select>
          </div>
          <div class="field">
            <label for="bankAmt" data-i18n="amtLabel">금액 (KRW)</label>
            <input type="number" id="bankAmt" value="10000000" min="0" step="10000" oninput="calcBank()" />
          </div>
          <div class="calc-box" id="bankCalcOut"></div>

          <table class="rate-tbl">
            <thead>
              <tr>
                <th data-i18n="thPeriod">기간</th>
                <th data-i18n="thRate">이자율</th>
              </tr>
            </thead>
            <tbody id="rateRows"></tbody>
          </table>
        </div>

        <div class="box">
          <h4 data-i18n="creditTitle">신용정보 조회 (NICE + 블록체인)</h4>
          <div class="field">
            <label for="niceIn" data-i18n="niceLabel">NICE 지수 (0~100)</label>
            <input type="number" id="niceIn" value="88" min="0" max="100" />
          </div>
          <div class="field">
            <label for="chainIn" data-i18n="chainLabel">블록체인 지수 (0~100)</label>
            <input type="number" id="chainIn" value="92" min="0" max="100" />
          </div>
          <button type="button" class="gold-btn" onclick="calcCredit()" data-i18n="creditBtn">신용정보 점수 조회</button>

          <div class="credit-box">
            <div>
              <div style="font-size:0.78rem; color:var(--text-sub);" data-i18n="creditScoreLabel">통합 신용점수</div>
              <div class="credit-score" id="creditScoreOut">915점</div>
            </div>
            <div style="font-size:0.84rem; text-align:right;" id="creditLimitOut"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- 하단 고정 4칸 바 -->
  <nav class="bottom-nav" aria-label="하단 고정 4칸 바">
    <button type="button" class="active" id="bHome" onclick="bottomNav('home')">
      <span>🏠</span>
      <span data-i18n="bHome">홈</span>
    </button>
    <button type="button" id="bWp" onclick="bottomNav('wp')">
      <span>📄</span>
      <span data-i18n="bWp">백서</span>
    </button>
    <button type="button" id="bAssets" onclick="bottomNav('web3')">
      <span>⚡</span>
      <span data-i18n="bWeb3">웹3</span>
    </button>
    <button type="button" id="bMenu" onclick="bottomNav('menu')">
      <span>☰</span>
      <span data-i18n="bMenu">전체 메뉴</span>
    </button>
  </nav>

  <!-- 백서 모달 -->
  <div class="modal-bg" id="wpModal" onclick="bgClose(event, 'wpModal')">
    <div class="modal-card">
      <div class="modal-top">
        <h3 data-i18n="wpTitle">HKWB · HK WorldBank 백서</h3>
        <button type="button" class="close-btn" onclick="closeModal('wpModal')" data-i18n="closeBtn">닫기</button>
      </div>
      <p style="font-size:0.9rem; color:var(--text-sub); margin-bottom:10px;" data-i18n="wp1"></p>
      <p style="font-size:0.9rem; color:var(--text-sub); margin-bottom:10px;" data-i18n="wp2"></p>
      <p style="font-size:0.9rem; color:var(--text-sub);" data-i18n="wp3"></p>
    </div>
  </div>

  <!-- 전체 메뉴 모달 -->
  <div class="modal-bg" id="menuModal" onclick="bgClose(event, 'menuModal')">
    <div class="modal-card">
      <div class="modal-top">
        <h3 data-i18n="menuTitle">HKWB 전체 메뉴</h3>
        <button type="button" class="close-btn" onclick="closeModal('menuModal')" data-i18n="closeBtn">닫기</button>
      </div>
      <div class="menu-grid">

    let curLang = "ko";
    let curNet = "swap";
    let curFn = "deposit";

    function fmtKrw(n) {
      return "₩ " + Math.round(n).toLocaleString("ko-KR");
    }

    function fmtQty(n) {
      if (n >= 1000) return n.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
      if (n >= 1) return n.toLocaleString("ko-KR", { maximumFractionDigits: 4 });
      return n.toLocaleString("ko-KR", { maximumFractionDigits: 6 });
    }

    function getDict(code) {
      if (code === "ko") return KO_TEXT;
      const meta = LANGS.find((x) => x.code === code) || LANGS[1];
      return {
        ...EN_TEXT,
        langLabel: `${meta.native} (${meta.ko})`,
        heroSlogan: `${EN_TEXT.heroSlogan} · ${meta.native}`
      };
    }

    function initLangs() {
      const sel = document.getElementById("langSelect");
      sel.innerHTML = LANGS.map((l, i) =>
        `<option value="${l.code}">${i + 1}. ${l.native} (${l.ko})</option>`
      ).join("");
      sel.value = curLang;
      sel.addEventListener("change", (e) => setLang(e.target.value));
    }

    function setLang(code) {
      curLang = code;
      const meta = LANGS.find((x) => x.code === code) || LANGS[0];
      const d = getDict(code);
      document.documentElement.lang = code;
      document.documentElement.dir = meta.rtl ? "rtl" : "ltr";

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const k = el.getAttribute("data-i18n");
        if (d[k] !== undefined) el.textContent = d[k];
      });

      renderNets();
      fillAssetSelects();
      fillTermSelects();
      calcSwap();
      calcW3Dep();
      calcBank();
      calcCredit();
    }

    function renderNets() {
      const isKo = curLang === "ko";
      document.getElementById("netGrid").innerHTML = NET_10.map((n) => `
        <button type="button" class="net-btn ${curNet === n.id ? "active" : ""}" onclick="pickNet('${n.id}')">
          <strong>${isKo ? n.ko : n.en}</strong>
          <span>${isKo ? n.subKo : n.subEn}</span>
        </button>
      `).join("");
    }

    function pickNet(id) {
      curNet = id;
      renderNets();
    }

    function fillAssetSelects() {
      const f = document.getElementById("fromAsset");
      const t = document.getElementById("toAsset");
      const prevF = f.value || "PI";
      const prevT = t.value || "USDT";
      const opts = ASSETS.map((a) =>
        `<option value="${a.id}">${curLang === "ko" ? a.nameKo : a.nameEn} (${a.sym})</option>`
      ).join("");
      f.innerHTML = opts;
      t.innerHTML = opts;
      f.value = prevF;
      t.value = prevT;
    }

    function fillTermSelects() {
      const d = getDict(curLang);
      const w3 = document.getElementById("w3Term");
      const bk = document.getElementById("bankTerm");
      const prevW3 = w3.value || "1y";
      const prevBk = bk.value || "1y";
      const html = Object.entries(TERMS).map(([k, v]) =>
        `<option value="${k}">${d[v.key]} (${v.min}% ~ ${v.max}%)</option>`
      ).join("");
      w3.innerHTML = html;
      bk.innerHTML = html;
      w3.value = prevW3;
      bk.value = prevBk;

      document.getElementById("rateRows").innerHTML = Object.values(TERMS).map((v) =>
        `<tr><td>${d[v.key]}</td><td class="rate-em">${v.min}% ~ ${v.max}%</td></tr>`
      ).join("");
    }

    function calcSwap() {
      const fId = document.getElementById("fromAsset").value;
      const tId = document.getElementById("toAsset").value;
      const qty = Math.max(0, parseFloat(document.getElementById("swapQty").value) || 0);
      const aFrom = ASSETS.find((a) => a.id === fId) || ASSETS[0];
      const aTo = ASSETS.find((a) => a.id === tId) || ASSETS[1];
      const out = qty * (aFrom.krw / aTo.krw) * 0.997;
      document.getElementById("swapCalcOut").innerHTML =
        `<strong>${fmtQty(qty)} ${aFrom.sym}</strong> → <strong>${fmtQty(out)} ${aTo.sym}</strong>`;
    }

    function calcW3Dep() {
      const d = getDict(curLang);
      const t = TERMS[document.getElementById("w3Term").value] || TERMS["1y"];
      const amt = Math.max(0, parseFloat(document.getElementById("w3Amt").value) || 0);
      const minI = amt * (t.min / 100) * t.yrs;
      const maxI = amt * (t.max / 100) * t.yrs;
      document.getElementById("w3DepOut").innerHTML =
        `${d[t.key]} (${t.min}%~${t.max}%) · ${d.estInt}: <strong>${fmtKrw(minI)} ~ ${fmtKrw(maxI)}</strong>`;
    }

    function switchChannel(ch) {
      const w3Panel = document.getElementById("web3Panel");
      const inPanel = document.getElementById("internetPanel");
      const w3Card = document.getElementById("cardWeb3");
      const inCard = document.getElementById("cardInternet");

      if (ch === "web3") {
        w3Panel.style.display = "block";
        inPanel.style.display = "none";
        w3Card.classList.add("active");
        inCard.classList.remove("active");
      } else {
        w3Panel.style.display = "none";
        inPanel.style.display = "block";
        inCard.classList.add("active");
        w3Card.classList.remove("active");
      }
    }

    function pickFn(fn) {
      curFn = fn;
      document.querySelectorAll(".six-btn").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-fn") === fn);
      });
      calcBank();
    }

    function calcBank() {
      const d = getDict(curLang);
      const t = TERMS[document.getElementById("bankTerm").value] || TERMS["1y"];
      const amt = Math.max(0, parseFloat(document.getElementById("bankAmt").value) || 0);
      const minI = amt * (t.min / 100) * t.yrs;
      const maxI = amt * (t.max / 100) * t.yrs;
      document.getElementById("bankCalcOut").innerHTML =
        `${fmtKrw(amt)} (${d[t.key]}) · ${d.estInt}: <strong>${fmtKrw(minI)} ~ ${fmtKrw(maxI)}</strong>`;
    }

    function calcCredit() {
      const d = getDict(curLang);
      const niceV = Math.max(0, Math.min(100, parseFloat(document.getElementById("niceIn").value) || 0));
      const chainV = Math.max(0, Math.min(100, parseFloat(document.getElementById("chainIn").value) || 0));
      const score = Math.round(300 + ((niceV * 0.55 + chainV * 0.45) / 100) * 700);
      const limit = score >= 900 ? 200000000 : score >= 800 ? 100000000 : 50000000;
      document.getElementById("creditScoreOut").textContent = `${score}`;
      document.getElementById("creditLimitOut").innerHTML = `${d.loanLimit}: <strong>${fmtKrw(limit)}</strong>`;
    }

    function bottomNav(tab) {
      ["bHome", "bWp", "bAssets", "bMenu"].forEach((id) => {
        document.getElementById(id).classList.remove("active");
      });
      if (tab === "home") {
        document.getElementById("bHome").classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (tab === "wp") {
        document.getElementById("bWp").classList.add("active");
        document.getElementById("wpModal").classList.add("open");
      } else if (tab === "web3") {
        document.getElementById("bAssets").classList.add("active");
        switchChannel("web3");
        document.getElementById("web3Panel").scrollIntoView({ behavior: "smooth" });
      } else if (tab === "menu") {
        document.getElementById("bMenu").classList.add("active");
        document.getElementById("menuModal").classList.add("open");
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function bgClose(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    function menuJump(target) {
      closeModal("menuModal");
      if (target === "home") {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (target === "web3") {
        switchChannel("web3");
        document.getElementById("web3Panel").scrollIntoView({ behavior: "smooth" });
      } else if (target === "internet") {
        switchChannel("internet");
        document.getElementById("internetPanel").scrollIntoView({ behavior: "smooth" });
      } else if (target === "wp") {
        document.getElementById("wpModal").classList.add("open");
      }
    }

    initLangs();
    setLang("ko");
  </script>
</body>
</html>
