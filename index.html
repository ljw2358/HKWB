<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 디지털 금융 혁신</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 상단 헤더: 좌측 로고 / 우측 언어 선택 */
        header {
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 1px;
        }

        .lang-select {
            background: #1a173b;
            color: #fbbf24;
            border: 1px solid #f59e0b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* 메인 컨텐츠 (중앙 정렬) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tagline {
            color: #f59e0b;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 48px;
            color: #fbbf24;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 36px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0d0b21;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
        }

        .btn-secondary {
            background: #1a173b;
            color: #fbbf24;
            border: 1px solid #f59e0b;
        }

        .btn-secondary:hover {
            background: #2d2659;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }
            .main-title {
                font-size: 32px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더: 좌측 HKWB 로고, 우측 언어 선택 -->
    <header>
        <div class="brand-logo">HKWB</div>
        <select class="lang-select" aria-label="언어 선택">
            <option value="ko">한국어 (KR)</option>
            <option value="en">English (US)</option>
            <option value="ja">日本語 (JP)</option>
            <option value="zh">中文 (CN)</option>
        </select>
    </header>

    <!-- 중앙 배치 메인 컨텐츠 -->
    <main>
        <div class="tagline">Next-Generation Digital Banking</div>
        <h1 class="main-title">
            인류와 기술이 공존하는<br>
            차세대 디지털 금융 혁신
        </h1>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="alert('Web3 디지털 은행으로 이동합니다.')">
                Web3 디지털 은행 진입하기
            </button>
            <button class="btn btn-secondary" onclick="alert('인터넷 은행으로 이동합니다.')">
                인터넷 은행 진입하기
            </button>
        </div>
    </main>

</body>
</html>
