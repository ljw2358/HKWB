<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 디지털 금융 혁신</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0d0b21;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 상단 네비게이션 (오른쪽 언어 선택) */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .lang-select {
            background: #1a173b;
            color: #fff;
            border: 1px solid #3d376d;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* 메인 컨텐츠 (왼쪽 정렬) */
        main {
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            max-width: 1200px;
        }

        .tagline {
            color: #a594fd;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 주요 진입 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: #1e1b4b;
            color: #c7d2fe;
            border: 1px solid #4338ca;
        }

        .btn-secondary:hover {
            background: #312e81;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* 모바일 대응 반응형 */
        @media (max-width: 768px) {
            header {
                padding: 16px 20px;
            }
            main {
                padding: 20px;
            }
            .main-title {
                font-size: 28px;
            }
            .btn-group {
                width: 100%;
                flex-direction: column;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 우측 상단 언어 선택 -->
    <header>
        <select class="lang-select" aria-label="언어 선택">
            <option value="ko">한국어 (KR)</option>
            <option value="en">English (US)</option>
            <option value="ja">日本語 (JP)</option>
            <option value="zh">中文 (CN)</option>
        </select>
    </header>

    <!-- 좌측 상단 핵심 타이틀 및 수정된 버튼 -->
    <main>
        <div class="tagline">HKWB Digital Bank</div>
        <h1 class="main-title">
            인류와 기술이 공존하는<br>
            차세대 디지털 금융 혁신
        </h1>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="alert('Web3 디지털 은행으로 이동합니다.')">
                Web3 디지털 은행 진입하기
            </button>
            <button class="btn btn-secondary" onclick="alert('인터넷 은행으로 이동합니다.')">
                인터넷 은행 진입하기
            </button>
        </div>
    </main>

</body>
</html>
